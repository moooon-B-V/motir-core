<!--
  Motir brand mark — the wave band. PIXEL-EXACT reference, not production artwork.
  Traced from Yue's reference drawing (2026-08-05) and fitted to the TRUE filled
  region: the reference was thresholded to the drawn curve, the area between the
  two edges flood-filled, and that mask's boundary fitted with least-squares
  cubic Beziers (Schneider). Zero of 55,000 pixels differ from the reference at 324px -- but it is a staircase polygon of 822 points that follows the screenshot's pixel grid, so it shows visible steps when enlarged. Kept as the accuracy reference; use wave-band.svg for anything that renders.
  See design/brand/design-notes.md sections 1 and 2.

  fill="currentColor" is deliberate: the mark carries NO colour of its own, so it
  follows the theme and the palette from whatever renders it. Set the colour on the
  consuming element -- color: var(--el-accent-on-surface) -- never inside this file.
  WARNING: that only works INLINE (<svg> / <use> / an imported component). Via
  <img src> or as a favicon, currentColor resolves to black and a baked-colour
  variant is required instead.
-->
