<!--
  Motir brand mark — the wave band (native 317 × 313).
  Traced from Yue's reference drawing (2026-08-05), closed at both ends, filled solid.
  See design/brand/design-notes.md §1 for how it was fitted and what it still owes.

  fill="currentColor" is deliberate: the mark carries NO colour of its own, so it
  follows the theme and the palette from whatever renders it. Set the colour on the
  consuming element — `color: var(--el-accent-on-surface)` — never inside this file.
  ⚠️ That only works INLINE (<svg> / <use> / an imported React component). Used via
  <img src> or as a favicon, currentColor resolves to black and a baked-colour
  variant is required instead.
-->
