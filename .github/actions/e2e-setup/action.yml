name: Playwright E2E setup
description: >-
  Everything a Playwright leg needs between `actions/checkout` and its first
  `pnpm test:e2e`: pnpm + Node, the node_modules / Prisma-client / browser
  caches, the pre-built `.next/` from the build job, `prisma migrate deploy`,
  and the retrying Playwright install. Extracted (MOTIR-1949) when the
  acceptance lane moved OUT of the `e2e` matrix into its own conditional job —
  two jobs now need this setup, and every past fix in it was hard-won
  (MOTIR-1679's apt-source removal, MOTIR-1706's build-artifact download,
  MOTIR-1742's Postgres action), so it lives in ONE place rather than being
  copied and then fixed in only one of them.

  NOT included, because they are the caller's: `actions/checkout` (a local
  action cannot run before the repo exists) and `./.github/actions/postgres`
  (kept in the job so the DB container's lifetime is visible where its
  DATABASE_URL is set).

inputs:
  next-build:
    description: >-
      Where `.next/` comes from. `download` (default) takes the artifact the
      `build` job of the same CI run published — the cheap path, available to
      any job in that workflow. `build` compiles it here, which the
      acceptance-video workflow needs: it is a SEPARATE workflow (so its checks
      can be absent rather than skipped), and a workflow cannot depend on
      another workflow's job or read its artifacts.
    required: false
    default: download

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
    - name: Cache node_modules
      id: cache-node-modules-e2e
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Cache Prisma client
      id: cache-prisma-e2e
      uses: actions/cache@v4
      with:
        path: |
          node_modules/.prisma
          node_modules/@prisma/client
        key: ${{ runner.os }}-prisma-client-${{ hashFiles('prisma/schema.prisma') }}
    - run: pnpm install --frozen-lockfile
      shell: bash
      if: steps.cache-node-modules-e2e.outputs.cache-hit != 'true'
    - run: pnpm prisma generate
      shell: bash
      if: steps.cache-prisma-e2e.outputs.cache-hit != 'true'
    # Download the pre-built .next/ from the build job so the webServer
    # boots via `next start` without building independently (MOTIR-1706).
    - name: Download .next/ build artifact
      if: inputs.next-build == 'download'
      uses: actions/download-artifact@v7
      with:
        name: next-build
        path: .next
    # The auth module reads BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID, and
    # GOOGLE_CLIENT_SECRET at import time — the same reason `pnpm build`
    # needs them. `pnpm prisma migrate deploy` creates the auth tables
    # from prisma/migrations; without this the first sign-up POST hits
    # an empty database and errors with "relation \"user\" does not
    # exist". (The `build` job runs this transitively via the build
    # script; here we run it explicitly because we don't run build.)
    - run: pnpm prisma migrate deploy
      shell: bash
      if: inputs.next-build == 'download'
    # The no-artifact path: `pnpm build` is `prisma generate && migrate deploy
    # && next build`, so it covers the migrate step above as well.
    - name: Build the app
      if: inputs.next-build == 'build'
      shell: bash
      run: pnpm build
    # Cache the Playwright browser binary across runs (and the matrix legs).
    # Every leg re-pays `playwright install` otherwise — pure fixed overhead
    # that sharding multiplies by the leg count. Keyed on the lockfile so a
    # @playwright/test bump invalidates it; the OS apt deps aren't cacheable,
    # so we still run install-deps on a hit (fast) and the full --with-deps
    # download only on a miss.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
    # MOTIR-1679 (the actual root cause): the GitHub ubuntu-24.04 runner image
    # preconfigures packages.microsoft.com apt sources (azure-cli + MS prod).
    # Those repos intermittently serve a BROKEN InRelease signature
    # ("Clearsigned file isn't valid, got 'NOSPLIT' ... is no longer signed"),
    # which fails the `apt-get update` that `playwright install(-deps)` runs
    # internally → exit code 100, killing the leg at SETUP (Run E2E skipped, 0
    # tests run). It lands on a DIFFERENT leg each run (whichever job's apt
    # re-fetch catches MS mid-glitch) — the flake tell. We do NOT need those
    # repos to install Chromium's OS deps (they come from the Ubuntu archive),
    # so drop any apt source referencing packages.microsoft.com before apt runs.
    # This removes the external dependency entirely; the per-install retry below
    # stays only as a backstop for genuinely transient Ubuntu-archive blips.
    - name: Remove broken third-party apt sources (Microsoft)
      shell: bash
      run: |
        for f in $(grep -rl packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null || true); do
          echo "Removing broken apt source: $f"
          sudo rm -f "$f"
        done
    # Retry the browser / OS-deps install (up to 3× with backoff) as a backstop:
    # the cache-miss `--with-deps` path also downloads the browser binary, and a
    # transient Ubuntu-archive 503 / network blip would otherwise red-light the
    # leg at setup. A transient failure self-heals on retry.
    #
    # EVERY ATTEMPT IS WRAPPED IN `timeout` (MOTIR-2970), and that wrapper is
    # what makes the retry above real rather than decorative. A `for` loop over
    # `if cmd; then exit 0; fi` can only fire on a non-zero EXIT, and the way
    # the Ubuntu archive actually fails here is a HANG: on 2026-08-18 three legs
    # across two PRs (#2103 bulk-1, #2103 billing-cloud, #2105 bulk-2) each sat
    # in the `apt-get update` that `playwright install(-deps)` shells out to for
    # 6h0m — GitHub's default per-JOB budget, not a slow suite — with attempts 2
    # and 3 unreachable and `Run E2E` never starting. Evidence: run 32073646174,
    # job 95529249270, where THIS step logged `duration_ms=21531687` after apt
    # fell back from a silent `azure.archive.ubuntu.com` to `archive.ubuntu.com`
    # and wedged with no timeout of its own. Bounding the attempt turns a wedge
    # into a failed attempt, which the existing loop already knows how to
    # handle, and drops the ceiling on this class by an order of magnitude (the
    # exact numbers are below, with the measurement they come from).
    #
    # `--kill-after` guarantees the attempt returns even if the child ignores
    # SIGTERM. Both budgets are sized off measurement, not feel: across 44 legs
    # of four green runs the WHOLE composite action — pnpm + node + three caches
    # + artifact download + `prisma migrate deploy` + this install — ran 65s to
    # 311s, median 85s. So 5min for the cache-hit path (apt only) and 7.5min for
    # the cache-miss path (which also downloads the Chromium bundle) are each
    # well past anything a healthy runner has ever needed, which is the point: a
    # budget tight enough to cut off legitimate work would just trade this flake
    # for a new one. Worst case a fully wedged mirror now costs 3x the budget
    # plus two 15s backoffs — ~15min cache-hit, ~23min cache-miss — against the
    # 360min it used to cost, and under the leg's own `timeout-minutes` in
    # ci.yml.
    #
    # ⚠️ Read the exit status through `|| status=$?`, NOT through `if`: this
    # step runs under `bash -e`, and `if cmd; then …; fi` yields 0 when no
    # branch is taken, so `$?` after the `fi` cannot tell a timeout (124/137)
    # from a plain failure.
    #
    # ⚠️ AND A TIMED-OUT ATTEMPT MUST CLEAR THE APT IT ORPHANED, or attempts 2
    # and 3 are reached and immediately useless. `timeout` signals `pnpm`, but
    # `playwright install(-deps)` shells out to `sudo apt-get`, and that child
    # is ROOT-owned: it survives, keeps its flock on /var/lib/apt/lists/lock,
    # and the next attempt dies in under a second with
    # `E: Could not get lock /var/lib/apt/lists/lock. It is held by process N`.
    # This is not hypothetical — it is what THIS fix's own first CI run did
    # (run 32128513614, leg `a11y-2`): attempt 1 correctly reported `TIMED OUT
    # after 300s`, then attempts 2 and 3 failed on the orphan's lock, so the
    # step still could not self-heal. It merely failed in 6 minutes instead of
    # 6 hours. Killing the orphan is what makes the retry real. The lock itself
    # needs no surgery — apt uses flock, which the kernel releases when the
    # holder dies — and `-x` matches the process NAME, so `sudo pkill` cannot
    # match its own command line and kill itself. `dpkg --configure -a` repairs
    # the one case a SIGKILL can leave behind (a wedge during install rather
    # than during `apt-get update`).
    - name: Install Playwright browser + OS deps (cache miss)
      shell: bash
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      env:
        PLAYWRIGHT_INSTALL_TIMEOUT: 450s
      run: |
        for attempt in 1 2 3; do
          status=0
          timeout --kill-after=30s "$PLAYWRIGHT_INSTALL_TIMEOUT" pnpm exec playwright install --with-deps chromium || status=$?
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::warning::playwright install --with-deps attempt $attempt TIMED OUT after $PLAYWRIGHT_INSTALL_TIMEOUT; clearing the apt it orphaned, retrying in 15s"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x apt || true
            sudo dpkg --configure -a >/dev/null 2>&1 || true
          else
            echo "::warning::playwright install --with-deps attempt $attempt failed (exit $status); retrying in 15s"
          fi
          sleep 15
        done
        echo "::error::playwright install --with-deps failed after 3 attempts"
        exit 1
    - name: Install Playwright OS deps (cache hit)
      shell: bash
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      env:
        PLAYWRIGHT_INSTALL_TIMEOUT: 300s
      run: |
        for attempt in 1 2 3; do
          status=0
          timeout --kill-after=30s "$PLAYWRIGHT_INSTALL_TIMEOUT" pnpm exec playwright install-deps chromium || status=$?
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::warning::playwright install-deps attempt $attempt TIMED OUT after $PLAYWRIGHT_INSTALL_TIMEOUT; clearing the apt it orphaned, retrying in 15s"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x apt || true
            sudo dpkg --configure -a >/dev/null 2>&1 || true
          else
            echo "::warning::playwright install-deps attempt $attempt failed (exit $status); retrying in 15s"
          fi
          sleep 15
        done
        echo "::error::playwright install-deps failed after 3 attempts"
        exit 1
