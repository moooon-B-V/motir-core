name: Converge un-landed cards

# Manual operator action (Story MOTIR-5799 · MOTIR-5809; `docs/decisions/approval-gates.md`
# §4 FOURTH AMENDMENT, point 9): put every `manual` card the OLD rules left holding a
# SPENT approval where the amendment now puts it — four populations:
#
#   A. `implemented` with a standing retryable or setting exit  → `in_review` + ONE gate
#   B. `implemented` with a standing conflict                   → already right, COUNTED
#   C. `approved` with a standing neutral removal               → `in_review` + ONE gate
#   D. `approved` with a member that never landed and carries no outcome, under an
#      approval older than ten minutes                          → a refusal row is
#      written (`unrecorded`, classed retryable) and the card asks again
#
# Every move goes through `settleUnlandedOutcome`, the SAME entry point a live queue exit
# and a live host refusal run.
#
# IDEMPOTENT + SAFE TO RE-RUN: a converged card is at `in_review`, so a second apply
# converges 0. A card whose head moved is skipped and re-arms on its next green, as
# today. `workflow_dispatch` ONLY — a data convergence is an explicit operator decision,
# mirroring `backfill-ci-state.yml`. Running it on production is MOTIR-5810's task, after
# the release carrying the re-ask is live.
#
# DEFAULTS TO A DRY RUN. Read the counts before applying.
#
# Inert until the SEED_DATABASE_URL secret is set: the guard step SKIPS (green, with a
# notice) on an unconfigured repository.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse only — classify and print, write nothing'
        type: boolean
        required: false
        default: true

concurrency:
  group: converge-ejected-cards
  cancel-in-progress: false

jobs:
  converge:
    name: Re-ask the merge question on cards ejected before the re-ask shipped
    runs-on: ubuntu-latest
    # NO HEALTHY RUN TO QUOTE — this lane has never run. Production held 6 standing
    # failure exits on 2026-09-19 and the sweep reads one card per transaction, so the
    # work itself is seconds; the install + `migrate deploy` ahead of it are what take
    # minutes. 20 minutes is the floor taken, generous headroom rather than a measured
    # duration — re-cut it against a real run once MOTIR-5810 has applied one.
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: converge-placeholder
      GOOGLE_CLIENT_SECRET: converge-placeholder
      HUSKY: '0'
    steps:
      - name: Check SEED_DATABASE_URL is configured
        id: guard
        env:
          SEED_DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
        run: |
          if [ -z "$SEED_DATABASE_URL" ]; then
            echo "::notice::SEED_DATABASE_URL is not set — skipping the convergence. Add it under Settings → Secrets and variables → Actions to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v6
      - if: steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/pnpm
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm prisma generate
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm prisma migrate deploy
      - if: steps.guard.outputs.enabled == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "false" ]; then
            echo "::warning::Applying the un-landed-card convergence — this WRITES."
            pnpm db:converge:unlanded-cards
          else
            pnpm db:converge:unlanded-cards --dry-run
          fi
