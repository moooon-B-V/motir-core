name: Backfill work-item CI state

# Manual operator action (MOTIR-5472): recompute `WorkItem.ciState` for every
# card that has pull requests, through the shipped recompute
# (`deliveryVerdict.recomputeWorkItemCiState`) — the SAME function the live CI
# path calls, never a fold re-implemented in SQL.
#
# WHY A BACKFILL. MOTIR-5470 makes every future event write the right answer and
# does nothing for the rows already in the table, which are wrong in three ways
# that will never self-correct: a stale per-pull-request verdict on a card
# delivered by more than one, `null` on every card a run delivered through its
# own session branch, and no `running` anywhere. For most of these cards there is
# no next event — their checks have finished — so nothing else is coming to fix
# them, and a badge and a filter are about to be built on the column.
#
# IDEMPOTENT + SAFE TO RE-RUN: the recompute writes only when the value changed,
# so a second run reports `changed: 0` and performs zero writes. Each card
# commits in its own transaction, so an interrupted run keeps its progress.
# There is no auto-on-merge trigger — a data backfill is an explicit operator
# decision, so this is `workflow_dispatch` (the "Run workflow" button) ONLY,
# mirroring `backfill-boards.yml`.
#
# DEFAULTS TO A DRY RUN. The input below is `true` unless the operator clears
# it, so the button's default action is to rehearse and print the `from → to`
# counts. Read those before applying — a hundred `failing → passing` is a
# repair, and a hundred `passing → failing` is a reason to stop.
#
# Inert until the SEED_DATABASE_URL secret is set: the guard step detects the
# missing secret and SKIPS (the job stays green with a notice), so an
# unconfigured repo doesn't fail. Add the secret to enable.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse only — fold and print, write nothing'
        type: boolean
        required: false
        default: true

# Never run two backfills at once. Each is idempotent, but two sweeps folding
# the same card concurrently would contend on its row lock for no benefit. One
# at a time; don't cancel an in-flight run, which would leave a partial sweep
# whose progress is fine but whose report nobody sees.
concurrency:
  group: backfill-ci-state
  cancel-in-progress: false

jobs:
  backfill:
    name: Recompute WorkItem.ciState for every card with pull requests
    runs-on: ubuntu-latest
    # No healthy run on record — this workflow is `workflow_dispatch`-only and
    # has never been run. Takes the short-job floor of 10 min that
    # `backfill-boards.yml` uses, on the same reasoning: install + generate +
    # migrate dominate, and the sweep itself makes NO host calls (unlike
    # `db:backfill:pr-base-ref`, which mints installation tokens), so its work is
    # database round-trips that scale with the number of cards that have pull
    # requests. Raise it from a measured run rather than pre-emptively.
    timeout-minutes: 10
    env:
      # The production (unpooled) Neon connection string — the SAME secret the
      # reseed and board backfills use. Empty when unset; the guard step skips.
      DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
      # Defensive parity with the sibling backfills: this script does not import
      # the Better-Auth instance today, but wiring them costs nothing and keeps
      # the job working if a transitive import ever pulls it in (its requiredEnv
      # check needs all three at module load). The GOOGLE_* values only register
      # the OAuth provider; no round-trip happens.
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: backfill-placeholder
      GOOGLE_CLIENT_SECRET: backfill-placeholder
      # No git hooks to wire in CI.
      HUSKY: '0'
    steps:
      # Gate the whole job on the secret being present. `secrets.*` can't be used
      # in a job/step `if:`, but a step CAN read it into an env var and branch —
      # so an unconfigured repo skips (green) instead of failing at migrate.
      - name: Check SEED_DATABASE_URL is configured
        id: guard
        env:
          SEED_DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
        run: |
          if [ -z "$SEED_DATABASE_URL" ]; then
            echo "::notice::SEED_DATABASE_URL is not set — skipping the CI-state backfill. Add it under Settings → Secrets and variables → Actions to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v6
      - if: steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/pnpm
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm prisma generate
      # Make sure the target DB carries the delivery + check tables the fold
      # reads before sweeping it.
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm prisma migrate deploy
      # The `--dry-run` flag is passed only when the input is true, so clearing
      # the checkbox is what applies the sweep. Written as a shell branch rather
      # than an expression-interpolated argument: an empty interpolation would
      # pass an EMPTY STRING, which the script's own argument parser rejects as
      # an unknown argument — correctly, but with a confusing message.
      - if: steps.guard.outputs.enabled == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "false" ]; then
            echo "::warning::Applying the CI-state backfill — this WRITES."
            pnpm db:backfill:ci-state
          else
            pnpm db:backfill:ci-state --dry-run
          fi
