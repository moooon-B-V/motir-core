# Warm the DEFAULT-BRANCH buildx layer cache (MOTIR-5126)
#
# ── THE FACT THIS WORKFLOW EXISTS FOR ────────────────────────────────────────
#
# A GitHub Actions cache entry is readable from **the ref that WROTE it, or from
# the repository's DEFAULT branch**. Nothing else. So `refs/heads/main` is the
# only scope every other ref is allowed to read — and until this file, nothing
# in this repository ever wrote a buildx scope there:
#
#   ci.yml → sandbox / runner-image   `pull_request` / `merge_group`, and both
#                                     carried `github.event_name != 'push'`
#   release-runner-image.yml          `push: tags: ['runner-v*']`
#   release-sandbox.yml               `push: tags: ['cli-v*']`
#
# A pull request writes `refs/pull/<n>/merge`; a queue entry writes
# `refs/heads/gh-readonly-queue/main/pr-<n>-<sha>`, which is deleted with its
# branch and reclaimed. A tag is not the default branch either. So every scope
# was written somewhere no later run could read, and `cache-from` imported
# nothing.
#
# ⚠️ IT IS "COLD ON EVERY NEW REF", NOT "COLD ALWAYS", AND THE DIFFERENCE IS THE
# WHOLE DEFECT. The same-ref half of the rule does fire: when the merge queue
# re-forms a group on an unchanged base sha the identical branch NAME recurs,
# and the second run reads what the first wrote —
#
#   34583080235  09:13:14  Build the image  1036 s   COLD, wrote the scope
#   34586771845  09:57:05  Build the image    35 s   WARM, read it back
#
# — which is a 30x gap on one Dockerfile, obtained by luck. A cache that works
# when a ref happens to repeat is one people reason about as though it works.
#
# The default-branch half is demonstrated in this repository too, by the OTHER
# cache client: `Linux-corepack-11.2.2` and `Linux-pnpm-store-…` live on
# `refs/heads/main` and a `pull_request` run restores them (run 34582658507,
# `Lint + Prettier`). Same cache service — only the buildx scopes had no writer.
#
# ── WHY A SEPARATE WORKFLOW, AND NOT `!= 'push'` REMOVED FROM `ci.yml` ───────
#
# That was the obvious change and it is the wrong one. `ci.yml` sets
# `concurrency: group: ${{ github.workflow }}-${{ github.ref }}` with
# `cancel-in-progress` FALSE on a push (MOTIR-3106 — cancelling there starved
# the deploy). A concurrency group with no cancellation QUEUES: run N+1 stays
# pending until run N finishes. `deploy` lives in that run, so anything added to
# the push lane is added to the critical path of the NEXT merge's release — and
# the sandbox matrix is the most expensive thing in `ci.yml` (a 50-minute
# per-profile ceiling). It would have re-created MOTIR-3106's defect in its slow
# form: not a starved deploy, a delayed one, which no check reports.
#
# Here the cache write has its OWN concurrency group, so it cannot queue behind
# or ahead of a release, and `ci.yml` keeps its `!= 'push'` gates untouched.
#
# ── WHAT THIS IS NOT ─────────────────────────────────────────────────────────
#
# NOT a gate. It verifies nothing, and nothing may be made to depend on it: the
# merge was already gated by the queue entry, which ran these very workflows
# against the composed tree. It is not in `deploy`'s `needs` and must never be —
# a red build here means the next pull request pays for a cold build, not that a
# release should stop. `publish: false` and the absence of `packages: write`
# mean it cannot push an image even if it tried; the release lanes remain
# `release-runner-image.yml` and `release-sandbox.yml`, on their own tags.

name: Image cache (main)

on:
  push:
    branches: [main]
    # ⚠️ THE SAME SET `ci.yml`'s `changes` JOB USES FOR `images`, IN GLOB FORM —
    # and the two are pinned together rather than trusted to stay in step.
    # `tests/ci-changed-paths-gate.test.ts` re-derives this list from that shell
    # `case` and fails when they diverge, because two path lists in two
    # languages in two files is exactly the shape that drifts silently: the
    # symptom of drift here is not a red check, it is a cold build weeks later.
    #
    # It is deliberately a `paths:` filter rather than a `changes`-style job:
    # this workflow has no other lane to gate, so a whole job to compute one
    # boolean would be a second implementation of the predicate rather than a
    # second copy of the list.
    paths:
      - 'packages/**'
      - 'prisma/**'
      - 'infra/ci-runner/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/sandbox-images.yml'
      - '.github/workflows/runner-image.yml'
      - '.github/workflows/ci.yml'
      - '.github/actions/buildx/**'
      # This file itself: a change to what it builds or when must refresh the
      # scope it is responsible for.
      - '.github/workflows/image-cache-main.yml'

  # ⚠️ A SECOND TRIGGER, BECAUSE MERGE TRAFFIC IS NOT A RELIABLE CLOCK FOR
  # EITHER JOB THIS WORKFLOW HAS — and MOTIR-5126 asked for this decision
  # explicitly rather than leaving it inherited: *"GHA caches evict after 7 days
  # without a hit and compete for a 10 GB per-repo budget … gating the write
  # narrows the cost and risks the scope going cold in quiet stretches. Say which
  # was chosen and why."* The `paths:` gate above is that narrowing; this is the
  # answer to what it costs.
  #
  # TWO things need a clock the merge stream cannot give:
  #
  # 1. BOOTSTRAP. The `ci-runner` scope is written only by a build that SURVIVES
  #    to its cache export, and a cold one is killed at the 20-minute ceiling
  #    roughly half the time. It only has to succeed ONCE — after that every
  #    build restores and finishes in ~35 s, including this workflow's own. Until
  #    then each attempt is a coin flip, and `push` supplies attempts only when
  #    somebody merges something image-touching. Both of the first two attempts
  #    lost (see the concurrency block); a scope that has never been written
  #    cannot bootstrap itself out of that on merge traffic alone.
  #
  # 2. EVICTION. An Actions cache is reclaimed after 7 days WITHOUT A HIT, and
  #    the sandbox blobs (461 MB · 345 MB · 125 MB each) push this repository
  #    against the 10 GB budget, so eviction is a live pressure rather than a
  #    theoretical one. A quiet week in `packages/` / `prisma/` — which is an
  #    ordinary week — takes the scope cold with nothing to notice it, and the
  #    cost lands on whoever opens the next pull request.
  #
  # SIX-HOURLY rather than daily: four attempts a day makes the bootstrap
  # near-certain within one, against a coin flip per attempt, and it keeps every
  # scope comfortably inside the 7-day window even across a holiday. It is not
  # free — each run is a build — but it is the cheapest thing on this lane and it
  # is strictly cheaper than the cold build it removes from a person's pull
  # request. Revisit the cadence if the budget tightens; do NOT revisit it by
  # raising the ceiling (`runner-image.yml`'s block says why).
  schedule:
    - cron: '20 */6 * * *'

  # So the scope can be re-warmed on demand — after an eviction, or to re-try a
  # bootstrap without waiting for the cron or inventing a commit.
  workflow_dispatch:

# ⚠️ THIS WAS `cancel-in-progress: true`, AND ITS PREMISE WAS FALSIFIED WITHIN
# THE HOUR — corrected rather than deleted, because the argument was a good one
# and the reason it fails is the whole finding.
#
# It read: this workflow "produces no release and gates nothing, so cancelling it
# loses only a cache write that the newer `main` is about to redo better — and
# without it a burst of merges queues a chain of builds, each writing a scope the
# next immediately supersedes."
#
# Every clause is true EXCEPT "is about to redo it better", and that one carries
# the decision. It assumes the newer run COMPLETES. For the `ci-runner` half it
# does not: a cold build of that image is apt-bound on a mirror whose throughput
# has been measured across a 430x range, and it is killed at `runner-image.yml`'s
# 20-minute ceiling roughly half the time (11 of 21 in the sample recorded in
# that file). **A cancelled build never reaches `#20 exporting to GitHub Actions
# Cache`, so it writes NOTHING.** Trading a run that is eighteen minutes in for
# one with a coin-flip chance of writing anything is not a better redo; it is a
# guaranteed loss against a possible gain.
#
# MEASURED, on this workflow's first two runs — both the whole reason it exists:
#
#   34597976860  12:16:29 → 12:36:45  20m16s  CANCELLED at the ceiling
#   34602517798  13:07:14 → 13:27:28  20m16s  CANCELLED at the ceiling
#
# After both, `refs/heads/main` held nine `sandbox-*` scopes and NO `ci-runner`
# scope — the sandbox profiles finish in 4–5 minutes and export, the runner image
# does not. So the mechanism this file was written for works, and the one scope
# that motivated it had still never been written.
#
# The queued-chain cost the old text feared is real and is the cheaper side: a
# chain of builds each superseding the next still WRITES, and one stale-by-a-
# commit layer cache is a valid cache — buildx layers are content-addressed, so a
# superseded scope costs a partial miss, never a wrong build. GitHub also holds
# at most one pending run per group, so the "chain" is one run deep.
#
# ⚠️ AND THE CEILING IS NOT THE KNOB — see `runner-image.yml`'s own block. This
# repository has refused to raise it three times for this mirror (MOTIR-1679,
# MOTIR-2970, MOTIR-3128), and MOTIR-3143 states the rule: *"Do NOT raise the
# retry count or the timeout. That is the move already made twice; it lowers
# probability and leaves the class."* Nothing here touches it.
concurrency:
  group: image-cache-main
  cancel-in-progress: false

jobs:
  # Both jobs call the SAME reusable workflows `ci.yml` calls, so the layers
  # written here are the layers a pull request will ask for. A bespoke build
  # would warm a cache nothing reads — the one-definition-two-entry-points shape
  # both image workflows already document, with this as a third entry point.
  sandbox:
    name: Sandbox images
    permissions:
      contents: read
    uses: ./.github/workflows/sandbox-images.yml
    with:
      publish: false

  runner-image:
    name: Runner image
    permissions:
      contents: read
    uses: ./.github/workflows/runner-image.yml
    with:
      publish: false
