name: CI

on:
  pull_request:
  push:
    branches: [main]

# Supersede an older run of the same ref when a new commit lands (saves CI
# minutes) — on a PR branch, where `github.ref` is `refs/pull/<n>/merge`, so a
# force-push cancels only its own predecessor.
#
# ⚠️ NOT on `main`, and that exception is the whole point (MOTIR-3106). Every
# merge pushes the SAME ref, so an unconditional `cancel-in-progress: true` put
# all of them in one group where the newest always wins.
#
# The loss is NOT that a given merge's run dies. A later run contains the
# earlier commits, so it would apply their migrations too — cancelling one run
# costs nothing on its own. The defect is that the run inheriting that
# obligation is itself cancelled by the merge after it, and so on: the deploy is
# STARVED, never reached. `deploy` sits behind every gate, so a run needs ~35
# minutes of clear air on a quiet day and far more under load — run 32233900851
# ran 08:42:13 → 10:01:30, 79 minutes, and was still going when the next merge
# killed it. Measured 2026-08-19: twelve merges between 08:24 and 11:05, largest
# gap 77 minutes, eleven cancelled runs, no release for ten hours — so
# MOTIR-3078's schema migration sat merged and unapplied on production, along
# with eleven other merges.
#
# ⚠️ AND DO NOT REACH FOR THE JOB-LEVEL GROUP INSTEAD — this line used to say
# the deploy job's own `fly-deploy` group "protects a release already IN FLIGHT",
# and that half was FALSE. **A job-level concurrency group governs QUEUEING
# between jobs in that group; it does NOT exempt the job from a workflow-level
# cancellation of its own run.** Measured on motir-ai (MOTIR-3284), which carried
# the identical `fly-deploy` group with `cancel-in-progress: false` and had three
# deploys cancelled in twenty-four hours anyway — two of them mid-release, one
# leaving the app on two different releases for nine minutes.
#
# So what protects a running deploy here is THIS expression, and only this
# expression: not cancelling the run on `main`. The `fly-deploy` group is still
# correct for what it actually does — serialising two releases so they cannot
# overlap — and it stays. It is simply not a second line of defence, and reading
# it as one is how motir-ai kept a broken guard that everybody had already read.
#
# The rest of the original sentence stands: nothing at the job level can protect
# a run that never arrives, which is the starvation this block exists to stop.
#
# Newest-wins is KEPT wherever it costs nothing, so this does not queue merges
# up without bound. GitHub holds at most ONE pending run per group and cancels
# the previously pending one, so the newest merge still claims the queued slot
# and still carries every commit before it. The only thing that changes is that
# the RUNNING one is allowed to finish.
#
# The expression is deliberately the one `acceptance-video.yml` already carries
# — that lane reached the same conclusion for its own reason (a blanket cancel
# destroys the per-merge baseline that tells you WHICH merge broke it), and one
# idiom across the repo is worth more than a second way of saying it. This
# workflow's only two triggers are a PR and a push to `main`, so "cancel iff
# pull_request" and "cancel iff not the default branch" are the same predicate
# here; the event form is the conservative one if a trigger is ever added.
#
# Safe interpolation: github.workflow is a fixed workflow name; github.ref is a
# validated git ref identifier (not user-controlled free-form input).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── Job time ceilings (MOTIR-3569) ─────────────────────────────────────────────
#
# EVERY job below that declares `runs-on` also declares `timeout-minutes`.
# GitHub's default is 360 minutes, and a job with no bound produces no VERDICT:
# a running job's logs cannot be downloaded (`BlobNotFound`), so the only
# readable signal is a step poll that says `in_progress` — which is exactly what
# a hang says too. On run 32959226187, `Vitest (2/3)` took 47.5 minutes against
# its siblings' 20 and 22 and PASSED; for 45 of those minutes the honest answer
# to "when will we know?" was "in up to six hours". MOTIR-2970 paid that budget
# three times in one afternoon when `playwright install-deps` wedged on an apt
# mirror, and fixed it at the one call site — the job-level gap it stood on was
# left open for the next hang anywhere else.
#
# ⚠️ A CEILING IS NOT A PERFORMANCE TARGET. It bounds a hang; it must never cut
# off a slow-but-healthy run. So each number below is derived from the job's
# OBSERVED duration with generous headroom, stated per job as
# `observed → ceiling (multiple)`, and every ceiling clears the worst run we
# have on record. Durations were measured across the four most recent green
# `ci.yml` runs (33167406878, 33164914867 and their two predecessors) plus the
# 47.5-minute outlier above; re-measure with
# `gh api repos/moooon-B-V/motir-core/actions/runs/<id>/jobs` before tightening
# one. If a job hits its ceiling, the question to ask is whether the work grew
# or the runner wedged — that is the whole point of having a number.
#
# ⚠️ Jobs of a few minutes get a 10-minute FLOOR rather than a tight multiple.
# At that scale a proportional bound buys nothing (six hours → ten minutes is
# already the entire saving) and a cold cache or a slow network turns it into a
# false red — which is a worse trade than a rare ten-minute stall.
#
# `sandbox` and `runner-image` carry none, and cannot: they call a reusable
# workflow, and GitHub does not accept `timeout-minutes` on a `uses:` job. Their
# ceilings belong in `sandbox-images.yml` / `runner-image.yml` — see MOTIR-3768.
#
# `tests/ci-job-timeouts.test.ts` asserts the invariant by re-deriving the job
# list from this file, so a job added later without a ceiling fails the suite
# rather than inheriting six hours in silence.
jobs:
  # ── What the diff can actually reach (MOTIR-3148) ───────────────────────────
  #
  # Every expensive lane below used to decide whether to run from the BRANCH
  # NAME — a `startsWith` test against the `seed/` / `design/` / `docs/`
  # prefixes. That is a claim about the diff inferred from a naming convention,
  # and it was wrong in
  # BOTH directions: a `subtask/…` PR touching only `docs/**` paid for the full
  # E2E matrix, and a `docs/…` branch that touched app code SKIPPED the entire
  # test suite and merged unverified. The second half is the one that matters —
  # it is a hole in the merge gate, not a cost problem.
  #
  # So the predicate now reads the diff. `app` is false only when EVERY changed
  # path is documentation, a design asset, or plan-seed data — the three sets
  # the branch prefixes stood for. `images` is true only when something the
  # container images are actually built from changed.
  #
  # ⚠️ BOTH DEFAULT TO `true`, AND THAT DIRECTION IS THE WHOLE SAFETY ARGUMENT.
  # A predicate that fails open costs a wasted lane; one that fails closed
  # merges untested code, which is the defect this job was written to remove.
  # So a non-pull_request event, an unavailable base commit, a failed `git
  # diff`, or an empty file set all run EVERYTHING.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    # Observed 0.4–2.4 min → 10 (~4x). Ten is the floor every short job
    # gets; see the ceilings block above.
    timeout-minutes: 10
    # Reads the diff, writes two booleans. Nothing else.
    permissions:
      contents: read
    outputs:
      app: ${{ steps.classify.outputs.app }}
      images: ${{ steps.classify.outputs.images }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The three-dot diff below needs the merge base, which a shallow
          # clone does not have.
          fetch-depth: 0
      - id: classify
        # Through `env:`, never spliced into the script — a branch name is
        # attacker-controlled text and `${{ }}` in a `run:` body is textual
        # substitution (the same rule `ci-complete` follows for `needs`).
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          emit() {
            echo "app=$1" >>"$GITHUB_OUTPUT"
            echo "images=$2" >>"$GITHUB_OUTPUT"
            echo "app=$1 images=$2"
          }

          if [ "$EVENT" != 'pull_request' ]; then
            echo 'Not a pull request — every lane runs.'
            emit true true
            exit 0
          fi

          # Capture first, THEN test. A `git diff | while` pipeline would hide
          # the diff's own exit status, which is the thing being guarded on.
          if ! files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo '::warning::Could not diff against the merge base — running every lane.'
            emit true true
            exit 0
          fi
          if [ -z "$files" ]; then
            echo '::warning::Empty changed-file set — running every lane.'
            emit true true
            exit 0
          fi
          echo "$files"

          app=false
          images=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # Anything that is NOT docs / design / plan-seed makes this a code
            # change. Written as "no exclusion matched" so a path nobody
            # anticipated counts as code — the fail-open direction again.
            #
            # ⚠️ `content/` IS APP CODE, AND IT IS NAMED FIRST BECAUSE `case` IS
            # FIRST-MATCH-WINS (MOTIR-3806). `content/legal/*.md` is not prose
            # ABOUT the application — it is data the application parses and
            # renders (`lib/legal/documents.ts`), and its front-matter `version`
            # drives the re-consent gate. The blanket `*.md` swallowed it, so a
            # legal-document-only pull request set `app=false` and skipped the
            # whole Vitest lane — including the seven `tests/legal/` suites that
            # exist to guard exactly that file class. Observed on PR #2427, the
            # first-ever revision of a published legal document. Stated as a
            # positive exception ahead of the exclusion rather than by rewriting
            # the glob, so the fail-open shape above is left intact.
            case "$f" in
              content/*) app=true ;;
              docs/*|design/*|scripts/plan-seed/*|*.md) ;;
              *) app=true ;;
            esac
            # ⚠️ WIDER THAN THE SANDBOX FOLDER, AND DELIBERATELY SO.
            # `sandbox-images.yml` builds with `context: .` and the Dockerfile's
            # builder stage is `COPY . .` — it runs `pnpm install
            # --frozen-lockfile` against every workspace manifest and packs the
            # CLI. So the image's inputs are the whole packages/ tree, the
            # lockfile, the root manifests and prisma/ — NOT just
            # packages/cli/sandbox/**. Gating on the sandbox folder alone would
            # skip the lane on exactly the changes most able to break it.
            # (`infra/ci-runner` is the other image and IS self-contained:
            # `context: infra/ci-runner`, one COPY of its own entrypoint.)
            # `tests/ci-changed-paths-gate.test.ts` re-derives this from the two
            # image workflows so the list cannot quietly go stale.
            case "$f" in
              packages/*|prisma/*|infra/ci-runner/*) images=true ;;
              pnpm-lock.yaml|pnpm-workspace.yaml|package.json|.npmrc) images=true ;;
              Dockerfile|.dockerignore) images=true ;;
              .github/workflows/sandbox-images.yml|.github/workflows/runner-image.yml) images=true ;;
              .github/workflows/ci.yml|.github/actions/buildx/*) images=true ;;
            esac
          done <<<"$files"

          emit "$app" "$images"

  lint:
    name: Lint + Prettier
    runs-on: ubuntu-latest
    # Observed 2.9–4.3 min → 15 (~3.5x). Prettier over the whole tree is the
    # variable half, so this one is sized on a multiple rather than the floor.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache node_modules
        id: cache-node-modules-lint
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        if: steps.cache-node-modules-lint.outputs.cache-hit != 'true'
      - run: pnpm lint
      - run: pnpm format:check

  # ── The whole-tree STRUCTURAL GUARDS (MOTIR-3144) ────────────────────────────
  #
  # These specs parse `lib/` + `app/` through the TypeScript compiler API and
  # assert structural facts: no service arrives unbound, a bare `$transaction`
  # cannot enclose a policy-gated statement, a second rate-limit counter cannot
  # appear. They are lint, in the shape of tests.
  #
  # They used to run inside `test` — sharded, database-backed and
  # `--coverage`-instrumented — where they competed for CPU with the suites that
  # make that job slow. `bare-transaction-guard` cost 8.1 s alone on a quiet box
  # and blew a 120 s hook budget on `Vitest (2/3)` TWICE in a row, with zero
  # assertion failures, on a branch that had not grown the scan by one file.
  # That is a contention multiplier above 14x, so no budget measured on a quiet
  # box was ever going to hold. Three earlier cards raised a budget or made a
  # scan faster (MOTIR-2815, MOTIR-3067, and this card's own first instance);
  # each fixed one guard and left the environment for the next one to find.
  #
  # Here the whole lane is ~18 s, deterministic, and its cost is a function of
  # the tree rather than of what else happens to be running.
  #
  # No Postgres and no `prisma generate`, deliberately: nothing in the lane
  # opens a database, and adding either would put it back in the cost class it
  # was moved out of. `tests/ci-structural-guards-lane.test.ts` guards this job's
  # presence, its config, and the completeness of the lane's membership.
  structural-guards:
    name: Structural guards
    runs-on: ubuntu-latest
    # Observed 1.4–2.0 min → 10 (~5x, the short-job floor).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache node_modules
        id: cache-node-modules-structural-guards
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        if: steps.cache-node-modules-structural-guards.outputs.cache-hit != 'true'
        env:
          HUSKY: '0'
      - run: pnpm test:guards

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    # Observed 2.0–2.6 min → 10 (~4x, the short-job floor).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache node_modules
        id: cache-node-modules-typecheck
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache Prisma client
        id: cache-prisma-typecheck
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: ${{ runner.os }}-prisma-client-${{ hashFiles('prisma/schema.prisma') }}
      - run: pnpm install --frozen-lockfile
        if: steps.cache-node-modules-typecheck.outputs.cache-hit != 'true'
      # Prisma client is generated, not committed — typecheck needs it.
      - run: pnpm prisma generate
        if: steps.cache-prisma-typecheck.outputs.cache-hit != 'true'
      - run: pnpm typecheck

  design-system:
    name: Design-system package
    runs-on: ubuntu-latest
    # Observed 1.1–1.3 min → 10 (~8x, the short-job floor).
    timeout-minutes: 10
    # The @motir/design-system package ships its own vitest suite (registries,
    # apply API, render, and the RSC-safe-barrel guard) that the root Vitest lane
    # does NOT run — its `include` globs only `tests/**`. Run it here so the
    # package's tests (incl. the MOTIR-1538 barrel guard) actually gate merges;
    # otherwise a regression to the RSC boundary would ship silently. No DB /
    # services needed — the suite is pure (no server, no Postgres).
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache node_modules
        id: cache-node-modules-ds
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      # `pnpm install`'s postinstall builds the package; build again explicitly so
      # the barrel guard reads a dist built from THIS commit's source, not a cached
      # one. Skip the husky prepare hook — CI has no git hooks to wire.
      - run: pnpm install --frozen-lockfile
        if: steps.cache-node-modules-ds.outputs.cache-hit != 'true'
        env:
          HUSKY: '0'
      - run: pnpm --filter @motir/design-system build
      - run: pnpm --filter @motir/design-system test

  cli:
    name: CLI package
    runs-on: ubuntu-latest
    # Observed 1.3–1.6 min → 10 (~6x, the short-job floor).
    timeout-minutes: 10
    # Same gap as the design-system job above: `@motir/cli`'s own vitest suite
    # (config stores, link resolution, dispatch, the client core, the agent
    # profile table, and the 7.9.7a sandbox-image invariants) lives at
    # packages/cli/test/**, which the root Vitest lane does NOT glob — so until
    # this job existed none of it gated a merge. Since 7.9.5 (MOTIR-883) the run
    # also enforces the package's per-FILE coverage gate. Pure unit tests: no
    # Postgres and no Next app (where the suite needs a server it starts a real
    # MCP one in-process). The suite that spawns the BUILT binary against the
    # real /api/mcp route lives at `tests/cli/` and rides the Vitest job below,
    # where Postgres is; the sandbox's docker build/smoke matrix is 7.9.7c's.
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      # No node_modules cache here on purpose: the shared cache key covers only
      # the ROOT node_modules, while a filtered run also needs
      # packages/cli/node_modules — a cache hit would skip the install that
      # creates it. `cache: pnpm` above already makes the install store-warm.
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: pnpm --filter @motir/cli typecheck
      # The bundle the story suite spawns is built from THIS commit's source;
      # building here too catches a broken bundle in this job rather than as a
      # confusing runtime failure inside a spawned child process over there.
      - run: pnpm --filter @motir/cli build
      - run: pnpm --filter @motir/cli test:coverage

  # ── The design-asset guards (MOTIR-2442) ──────────────────────────────────
  # The one lane in this file with NO branch-prefix `if:`, and that absence is
  # the whole job. Every other skip below reads "a design-only diff has no app
  # code to exercise", which is true of the app suites and exactly backwards for
  # the two specs that read the design ASSETS rather than the app: the only pull
  # requests that can break them were the only ones that never ran them.
  # MOTIR-2259 merged green on `design/MOTIR-2259-roles-permissions`, `main`
  # went red, and it surfaced hours later on an unrelated `subtask/*` PR that
  # had touched no design asset (MOTIR-2441).
  #
  # WHY A JOB OF ITS OWN rather than widening the Vitest skip: the Vitest lane
  # needs Postgres, a migrate deploy and three sharded runners, plus the
  # `coverage` merge that is `needs: test` — the saving the prefix exists for.
  # This lane needs none of it. `vitest.design.config.ts` drops the root
  # config's per-worker-database globalSetup, so the run is an install and ~3
  # seconds of Node, and it can afford to be unconditional.
  #
  # It reports `success` on every branch prefix and `skipped` on none, so it
  # adds no greyed check anywhere (the e2e job's note on the acceptance lane:
  # a job-level `if:` only downgrades a check, it does not remove it). The
  # required-context set is untouched — `CI complete` is still the one required
  # check, and this job is gated through it like every other.
  #
  # `tests/ci-design-guards-lane.test.ts` guards the arrangement, including the
  # part a workflow file cannot state: that every spec reading `design/**` is in
  # the config's include list.

  design-guards:
    name: Design asset guards
    runs-on: ubuntu-latest
    # Observed 1.1–1.4 min → 10 (~7x, the short-job floor).
    timeout-minutes: 10
    permissions:
      # `contents: read` and nothing else. This job used to also request
      # `id-token: write`, for the keyless OIDC identity the design-result
      # publish step authenticated off (MOTIR-2668). That step is retired
      # (MOTIR-3797) — the AGENT now publishes through `publish_design_result`
      # — so the permission has no consumer left and is dropped with it.
      # `authenticateGithubOidc` itself is untouched: the acceptance-video
      # publisher still uses it, from its own workflow's own `id-token: write`.
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache node_modules
        id: cache-node-modules-design-guards
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      # No `prisma generate` and no Postgres: neither spec in the lane imports
      # the Prisma client, and the config it runs under provisions no database.
      # Adding either would put this lane back in the cost class the `design/*`
      # prefix exists to avoid.
      - run: pnpm install --frozen-lockfile
        if: steps.cache-node-modules-design-guards.outputs.cache-hit != 'true'
        env:
          HUSKY: '0'
      - run: pnpm vitest run --config vitest.design.config.ts

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    # Observed 3.6–4.5 min → 15 (~3.3x). `next build` grows with the app and
    # is the one short job whose normal duration has moved, so it gets a
    # multiple rather than the floor.
    timeout-minutes: 15
    # Postgres is started by ./.github/actions/postgres (first step below), NOT
    # by a `services:` block — see that action's header for why (MOTIR-1742).
    env:
      # In CI we use the standard 5432 (no doooo-postgres collision here).
      DATABASE_URL: postgresql://prodect:prodect@localhost:5432/prodect
      # Better-Auth reads BETTER_AUTH_SECRET at module-evaluation time, and
      # `next build` imports the auth module while collecting page data —
      # so the var must be present even though no real auth happens during
      # build. This is a throwaway value used ONLY for the CI build; the
      # real per-environment secret lives in the Vercel dashboard and is
      # rotated independently. Safe to commit because it grants no access
      # to anything — it just lets the module load.
      BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret-do-not-reuse
      # Subtask 1.1.4: Google OAuth provider requires both env vars at
      # module load (requiredEnv check). CI uses placeholders — they let
      # Better-Auth register the provider so `next build` succeeds; the
      # real per-environment values live in the Vercel dashboard. The
      # build never actually hits Google with these.
      GOOGLE_CLIENT_ID: ci-build-only-placeholder
      GOOGLE_CLIENT_SECRET: ci-build-only-placeholder
    steps:
      - uses: actions/checkout@v6
      - name: Start Postgres
        uses: ./.github/actions/postgres
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache node_modules
        id: cache-node-modules-build
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache Prisma client
        id: cache-prisma-build
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: ${{ runner.os }}-prisma-client-${{ hashFiles('prisma/schema.prisma') }}
      - run: pnpm install --frozen-lockfile
        if: steps.cache-node-modules-build.outputs.cache-hit != 'true'
      # Prisma 7's `migrate deploy` does not auto-generate the client (unlike
      # `migrate dev`); next build's internal `tsc` then can't resolve
      # PrismaClient. Generate explicitly before build. The `migrate deploy`
      # step that used to live here was folded into the `build` script in
      # 8fc649d so every Vercel deploy self-migrates its target database
      # (production Neon for prod, the per-PR Neon branch for previews) —
      # `pnpm build` here invokes that same script and migrates this job's
      # ephemeral Postgres service container.
      - run: pnpm prisma generate
        if: steps.cache-prisma-build.outputs.cache-hit != 'true'
      - run: pnpm build
      # MOTIR-3219 — the WHOLE-PROJECT-TRACE gate. Turbopack traces each server
      # entry's files into a `*.nft.json`, and `copyTracedFiles` ships exactly
      # that list in `output: 'standalone'`. A filesystem read whose path it
      # cannot resolve makes it give up and trace the ENTIRE repository — which
      # is what `instrumentation.ts`'s E2E boundary mocks did for months: 4510
      # traced files, a 464 MB `.next/standalone`, and every check green.
      #
      # Next warns about it once per build and does NOT fail, which is exactly
      # how it survived — so the gate reads the `.nft.json` files rather than
      # the build log. That is the stronger signal on three counts: it fails,
      # it names EVERY offending entry (the warning names only the first module
      # it reaches, so a partial fix reads like none), and it cannot be
      # silenced by `experimental.turbopack.ignoreIssue`, which matches on the
      # message and would leave the bundle exactly as large. See the script's
      # header and `lib/test-fixture-file.ts`.
      #
      # It lives here, after `pnpm build`, because `.next/server` is this job's
      # own output — the artifact upload below hands the same `.next` to the
      # e2e job, so a widened trace is caught before anything consumes it.
      - name: Assert no entry traced the whole project into the NFT list
        run: pnpm assert:nft-trace
      # MOTIR-1960 — the SCHEMA-DRIFT gate. `pnpm build` above ran
      # `prisma migrate deploy` against this job's ephemeral Postgres, so the
      # database here is a replay of every migration from empty — exactly what
      # this diff needs, and why the gate lives in this job rather than paying
      # for a runner and a Postgres of its own. It asserts the datamodel and that
      # replay agree; `--exit-code` turns any difference into a non-zero exit
      # (and it is deliberately NOT piped, so the exit status is the step's).
      #
      # Nothing else in CI would notice: drift is invisible to `migrate status`
      # (which only reads history), invisible to the suite (which runs against a
      # database built from the same migrations), and surfaces only as a spurious
      # ALTER at the top of the NEXT person's `migrate dev` — which is how
      # MOTIR-1960 went unnoticed from 2026-07-31 to 2026-08-01, and how the
      # `attachment.uploader_user_id` FK drift before it went unnoticed for
      # longer. See CLAUDE.md's "Migrations" rules for what causes it.
      - name: Assert the datamodel and the migrations agree (no schema drift)
        run: pnpm prisma migrate diff --from-schema prisma/schema.prisma --to-config-datasource --exit-code
      # Share the production build with the e2e job so each matrix leg's
      # webServer boots from the pre-built .next/ instead of building
      # independently (MOTIR-1706).
      - name: Upload .next/ build artifact
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next
          retention-days: 1
          include-hidden-files: true

  test:
    # Sharded matrix (MOTIR-1705): ~235 test files split across 3 runners,
    # each with its own Postgres service container and per-worker DB isolation
    # (MOTIR-754). Wall clock goes from the slowest file in the batch (~8–10 min)
    # to the slowest shard (~2–3 min). Coverage runs separately in the `coverage`
    # job below to avoid cross-shard merge complexity.
    name: Vitest (${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    # Observed 20.1–24.9 min across three shards and four green runs → 75
    # (~3x the slowest ordinary shard). ⚠️ THE MULTIPLE IS NOT THE BINDING
    # CONSTRAINT HERE — the outlier is. `Vitest (2/3)` ran 47.5 minutes on run
    # 32959226187 and PASSED, with every CPU-bound phase the same or faster
    # than the 19-minute run before it and the entire delta inside test
    # execution: an environment effect, never root-caused, and explicitly not
    # this job's to fix. 75 clears that run by 1.6x, so it would still have
    # passed. 45 — the number `e2e` uses — would have FAILED it, which is the
    # reason this ceiling is not simply copied from the lane next door.
    timeout-minutes: 75
    needs: changes
    # Skip the integration suite when the diff touches only documentation,
    # design assets or plan-seed data — none of them reach app code, services
    # or repositories, so tests that run against a real Postgres to exercise
    # that code have nothing new to cover. lint/typecheck/build still run.
    # The `changes` job computes this from the DIFF (MOTIR-3148); it used to be
    # read off the branch prefix, which let a `docs/…` branch carrying app code
    # skip this suite entirely. Every non-pull_request event runs it.
    if: ${{ needs.changes.outputs.app == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
    # Postgres is started by ./.github/actions/postgres (first step below), NOT
    # by a `services:` block — see that action's header for why (MOTIR-1742).
    env:
      # In CI Postgres runs on the standard 5432.
      DATABASE_URL: postgresql://prodect:prodect@localhost:5432/prodect
      # The auth module reads these at import time (Better-Auth's requiredEnv
      # check); the Vitest suite imports it transitively. Throwaway CI values —
      # see the build job for the rationale. No real OAuth happens here.
      BETTER_AUTH_SECRET: ci-test-only-not-a-real-secret-do-not-reuse
      GOOGLE_CLIENT_ID: ci-test-placeholder
      GOOGLE_CLIENT_SECRET: ci-test-placeholder
      # Skip the husky install postinstall — CI has no .git/hooks to wire.
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - name: Start Postgres
        uses: ./.github/actions/postgres
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache node_modules
        id: cache-node-modules-test
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache Prisma client
        id: cache-prisma-test
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma/client
          key: ${{ runner.os }}-prisma-client-${{ hashFiles('prisma/schema.prisma') }}
      - run: pnpm install --frozen-lockfile
        if: steps.cache-node-modules-test.outputs.cache-hit != 'true'
      # The CLI story suite (`tests/cli/`) builds and SPAWNS the `motir` binary,
      # which needs `packages/cli/node_modules` — for tsup, and at run time for
      # the deps the bundle deliberately externalizes (commander + the MCP SDK).
      # The node_modules cache above covers the ROOT only, so on a cache hit the
      # root install is skipped and the package's own tree is absent; this
      # filtered install restores just that project (~9s warm, a no-op when the
      # full install already ran). Without it the suite fails with a module-not-
      # found from inside the child process, which reads like a CLI bug.
      - run: pnpm install --frozen-lockfile --filter @motir/cli
      - run: pnpm prisma generate
        if: steps.cache-prisma-test.outputs.cache-hit != 'true'
      - run: pnpm prisma migrate deploy
      # Run the test suite sharded, COLLECTING coverage into a per-shard blob
      # report (MOTIR-1711). `--config vitest.collect.config.ts` is the base
      # vitest.config.ts with the per-file thresholds STRIPPED (a shard only
      # exercises a subset of the gated files, so a per-shard gate would fail
      # on partial coverage); the `coverage` merge job below enforces them on
      # the MERGED result via the base config. `--reporter=default` keeps test
      # output in the log for debugging; `--reporter=blob` writes
      # blob-<shard>-<total>.json (carrying v8 coverage) for the merge job to
      # consume. `--shard` does NOT auto-enable blob in Vitest 4, so it must be
      # passed explicitly.
      - run: pnpm vitest run --config vitest.collect.config.ts --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=default --reporter=blob --coverage
      # Share this shard's blob report with the `coverage` merge job.
      # `include-hidden-files: true` is REQUIRED: the blob reporter writes to
      # .vitest-reports/ (a dot-directory), and upload-artifact EXCLUDES hidden
      # files/dirs by default -- without this the upload finds "no files",
      # uploads nothing, and the merge job crashes with ENOENT on
      # .vitest-reports. Same gotcha as the .next/ artifact (MOTIR-1706).
      - name: Upload coverage blob
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .vitest-reports
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Vitest coverage
    runs-on: ubuntu-latest
    # Observed 1.1–1.3 min → 10 (~8x, the short-job floor). It only merges the
    # shards' reports; the measuring is done by `test`.
    timeout-minutes: 10
    if: ${{ needs.changes.outputs.app == 'true' }}
    needs: [test, changes]
    env:
      # The merge step (`vitest --mergeReports`) does NOT run any tests, so it
      # needs no Postgres service / migrate -- it only combines the shard blobs
      # and enforces the thresholds. These auth env vars stay present only
      # because vitest.config.ts sets them via `??=` at module-eval time; they
      # are never used (no test imports lib/auth during a merge).
      BETTER_AUTH_SECRET: ci-coverage-only-not-a-real-secret-do-not-reuse
      GOOGLE_CLIENT_ID: ci-coverage-placeholder
      GOOGLE_CLIENT_SECRET: ci-coverage-placeholder
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache node_modules
        id: cache-node-modules-coverage
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        if: steps.cache-node-modules-coverage.outputs.cache-hit != 'true'
      # Download every test shard's coverage blob into .vitest-reports/ so the
      # merge step can combine them. `merge-multiple` flattens all matching
      # artifacts into the one directory `vitest --mergeReports` reads from.
      - name: Download coverage blobs
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-shard-*
          path: .vitest-reports
          merge-multiple: true
      # Merge the per-shard blobs into one coverage report and enforce the
      # >=90% per-module thresholds (vitest.config.ts) on the MERGED result
      # (MOTIR-1711). This REPLACES the old `vitest run --coverage` full-suite
      # re-run -- no tests execute here, so this step is near-instant (the
      # shards already collected the coverage). A regression below 90% fails
      # CI (vitest exits 1 on a threshold breach).
      - run: pnpm vitest --mergeReports --coverage

  e2e:
    # Sharded matrix (Subtask: E2E CI speedup). The suite is `workers: 1` /
    # `fullyParallel: false` ON PURPOSE — every spec shares one Postgres and a
    # global truncate, so parallel workers IN ONE PROCESS would race. We can't
    # parallelize inside a job, so we parallelize ACROSS jobs: each matrix leg is
    # its own runner with its OWN ephemeral `pgvector/pgvector:pg16` container
    # (started by ./.github/actions/postgres), so there is zero cross-leg DB
    # contention (the local shared-:5433
    # flake does not exist between CI jobs). Wall-clock goes from sum(all specs)
    # to max(slowest leg).
    #   • 5 "bulk" legs — the non-at-scale, non-a11y suite, split by MEASURED
    #     per-spec cost (`tests/e2e/shard-plan.ts`, MOTIR-2617), NOT by
    #     Playwright's `--shard=i/5`. Bumped 4→5 to shrink the slowest bulk leg;
    #     pulling the @a11y sweeps out into their own leg (below) already removed
    #     the worst long pole, so 5 is the balance — each leg re-pays the install
    #     + dual-webServer boot, and more legs past this give diminishing returns
    #     for the cost.
    #     WHY NOT `--shard=i/5`: it partitions by test COUNT in discovery order,
    #     so what a spec costs never enters the split. Measured across two green
    #     `main` runs (31438176201 + 31440981319) the five legs ran 159–280s of
    #     test time — 55% of mean, slowest leg ~1.75x the fastest — and the
    #     overloaded leg is where the webServer crosses its memory cliff and
    #     hangs every later navigation (MOTIR-2617, three occurrences on bulk-4:
    #     PRs #1636 / #1912 / #2014). The plan bin-packs the same measurement to
    #     <1% spread, and a vitest guard (tests/e2e-shard-plan.test.ts) fails the
    #     unit lane if a NEW spec has no measured cost — which is what stops one
    #     silently rejoining the heaviest shard. `E2E_SHARD` (below) is how a leg
    #     tells playwright.config.ts which slice it is.
    #   • 2 "a11y" legs — every `@a11y` axe sweep, pulled out of the bulk legs
    #     via `--grep "@a11y"` (and `--grep-invert`-ed OUT of them), then split
    #     `--shard=i/2`. WHY a dedicated selection and not just more bulk shards:
    #     Playwright's count-based sharding keeps whole files together in
    #     DISCOVERY ORDER and slices contiguously, so the (alphabetically
    #     adjacent) shell-a11y* files always cluster into ONE bulk shard no
    #     matter the shard count — that shard was the bulk-3 long-pole (16 slow
    #     axe sweeps in one leg). Selecting by the @a11y TAG instead spreads
    #     nothing back into the bulks and lets the axe suite run as its own
    #     parallel legs. It was ONE leg until MOTIR-2482 added the widened-route
    #     sweeps and MEASURED the leg past double; the split, its numbers, and
    #     why the knob is legs rather than `workers` are in the matrix entry.
    #     The shell-a11y file is also split four ways (shell-a11y / -tokens /
    #     -detail / -wide) so the shard boundary has files to fall between.
    #   • 2 "at-scale" legs — board(-scrum)-at-scale and collab-at-scale, which
    #     need distinct env overrides (issue-cap / seed knobs) and so can't share
    #     a shard. They run IN PARALLEL with the bulk legs.
    # The at-scale override env is supplied per-leg from the matrix; bulk legs
    # leave those vars empty (''), which playwright.config.ts treats as unset
    # (BOARD_LOAD_SEAM_ENV skips empty values) so the shipped 5,000/14 board
    # constants and default collab seed apply — a bulk leg must NOT inherit an
    # at-scale cap or it would skew the ordinary board specs.
    name: Playwright E2E (${{ matrix.id }})
    runs-on: ubuntu-latest
    # Defence in depth for MOTIR-2970. GitHub's default per-job budget is 360
    # minutes, and a leg that wedges in setup burns every one of them while
    # holding `CI complete` red — three times in ~6 hours on 2026-08-18, each on
    # a diff the leg never exercised. The per-attempt `timeout` in
    # `.github/actions/e2e-setup` is the fix for that specific wedge; this is the
    # backstop for the next one, wherever in the leg it happens to sit. 45min is
    # ~2.6x the slowest leg observed across six green runs (66 legs, 4–17min,
    # median 8) — wide enough that a slow-but-healthy leg is never cut off, and
    # far below a budget no legitimate leg could ever need.
    timeout-minutes: 45
    # Read-only: these legs check out, run specs and upload a report. The
    # `id-token: write` this job used to carry belonged to the acceptance-video
    # publish, which now lives in its own `acceptance-video.yml` workflow
    # (MOTIR-1949) — the lane that mints an OIDC token should be the one lane
    # that actually publishes.
    permissions:
      contents: read
    # Skip E2E when the diff touches only documentation, design assets or
    # plan-seed data — none of them reach app code in the Next bundle, so the
    # Playwright suite has nothing new to exercise. lint/typecheck/build/test
    # still run. The `changes` job computes this from the DIFF (MOTIR-3148);
    # the branch-prefix test it replaces was wrong in both directions.
    if: ${{ needs.changes.outputs.app == 'true' }}
    # Wait for the build job — E2E is more expensive than a build failure
    # surfaces and there's no point burning Playwright minutes if `next
    # build` is red.
    needs: [build, changes]
    strategy:
      # One leg failing must NOT cancel the others — we want the full E2E
      # picture (and all Playwright reports) from a single run, not a race to
      # the first red shard.
      fail-fast: false
      matrix:
        include:
          # The non-at-scale, non-a11y suite, split five ways. `--grep-invert`
          # excludes the three at-scale tags AND the @a11y sweeps (their own leg
          # below) — that selection is by TAG and unchanged. `shard:` then names
          # this leg to playwright.config.ts, which narrows `testMatch` to the
          # spec files tests/e2e/shard-plan.ts assigns it by measured cost.
          - id: bulk-1
            shard: bulk-1
            args: '--grep-invert "(board(-scrum)?|collab|epic6)-at-scale|@a11y"'
          - id: bulk-2
            shard: bulk-2
            args: '--grep-invert "(board(-scrum)?|collab|epic6)-at-scale|@a11y"'
          - id: bulk-3
            shard: bulk-3
            args: '--grep-invert "(board(-scrum)?|collab|epic6)-at-scale|@a11y"'
          - id: bulk-4
            shard: bulk-4
            args: '--grep-invert "(board(-scrum)?|collab|epic6)-at-scale|@a11y"'
          - id: bulk-5
            shard: bulk-5
            args: '--grep-invert "(board(-scrum)?|collab|epic6)-at-scale|@a11y"'
          # Every @a11y axe sweep (the shell-a11y* files + the per-feature a11y
          # closers), pulled into one parallel leg so the slow sweeps stop
          # clustering into a single bulk shard. Standard board/collab defaults
          # apply (no override env).
          #
          # SPLIT 1 leg -> 2 (MOTIR-2482) — the contingency the previous version
          # of this comment named ("shard this leg if it becomes the long pole"),
          # taken on a measurement rather than a feeling. MOTIR-2482 adds
          # shell-a11y-wide.spec.ts: eight previously-unswept routes, each on a
          # POPULATED fixture. Measured locally on one worker it costs 2.2 min
          # against a ~1.4 min pre-existing @a11y leg — it more than doubles the
          # suite. Against run 31286985817 (a11y `Run E2E` step 3.6 min / job 5.2
          # min; slowest bulk leg step 6.3 min / job 8.0 min) a single leg would
          # land near 7.4 min: under the long pole, but holding none of the
          # headroom the NEXT a11y card needs. `--shard=i/2` partitions by test
          # COUNT (26 today) AFTER the `--grep`, so the two run in parallel and
          # the leg returns to ~4 min with room to grow.
          #
          # Per `notes.html` #38 the parallelism knob is the CI job matrix, never
          # in-process `workers`: each leg gets its OWN Postgres service
          # container, which is exactly what makes adding a leg safe and raising
          # `workers: 1` unsafe (the suite shares one DB + a global truncate).
          - id: a11y-1
            args: '--grep "@a11y" --shard=1/2'
          - id: a11y-2
            args: '--grep "@a11y" --shard=2/2'
          # NOTE: the acceptance-video lane is NOT a leg here (MOTIR-1949). It
          # is its own WORKFLOW — `.github/workflows/acceptance-video.yml`, with
          # a `paths:` filter on `tests/e2e/acceptance*.spec.ts` — so that a PR
          # which owns no acceptance spec sees no acceptance check AT ALL. A
          # matrix leg cannot be dropped by an expression, and a job-level `if:`
          # only downgrades the check to a greyed `Skipped`; an untriggered
          # workflow is the only thing that leaves nothing behind.
    # Postgres is started by ./.github/actions/postgres (first step below), NOT
    # by a `services:` block — see that action's header for why (MOTIR-1742).
    env:
      # In CI Postgres runs on the standard 5432.
      DATABASE_URL: postgresql://prodect:prodect@localhost:5432/prodect
      # See the build job for the rationale on these throwaway values.
      # Better-Auth's module-load requiredEnv check needs them present;
      # the actual OAuth round-trip is intercepted by the undici MockAgent
      # in instrumentation.ts (E2E_TEST_OAUTH=1 below).
      BETTER_AUTH_SECRET: ci-e2e-only-not-a-real-secret-do-not-reuse
      GOOGLE_CLIENT_ID: ci-e2e-placeholder
      GOOGLE_CLIENT_SECRET: ci-e2e-placeholder
      # Dev-only file email provider — emails appended as JSON lines to
      # EMAIL_OUTBOX_PATH so the credentials spec can capture the reset
      # link. The playwright.config.ts's webServer.env block ALSO sets
      # these on the dev server it spawns, but setting them at the job
      # level too keeps them visible to anyone reading the workflow file.
      EMAIL_PROVIDER: file
      EMAIL_OUTBOX_PATH: /tmp/motir-test-emails.jsonl
      E2E_TEST_OAUTH: '1'
      E2E_TEST_OAUTH_USER_PATH: /tmp/motir-test-oauth-user.json
      # Skip the husky install postinstall — CI has no .git/hooks to wire.
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - name: Start Postgres
        uses: ./.github/actions/postgres
      # pnpm + Node, the three caches, the pre-built `.next/`, migrate deploy and
      # the retrying Playwright install — shared verbatim with the acceptance
      # lane in `acceptance-video.yml` (MOTIR-1949).
      - uses: ./.github/actions/e2e-setup
      # NOTE: the lane's job EXECUTOR needs no setup step of its own. It used to
      # be a vendor dev-server binary — a pinned `inngest-cli` devDependency whose
      # postinstall fetched a 95MB Go binary, allowlisted in pnpm-workspace.yaml
      # so it landed before Playwright's 120s webServer window rather than inside
      # it. MOTIR-3418 retired it: the executor is the app's own worker bundle,
      # started by `globalSetup` from the same source the specs are testing.
      # ONE run step per matrix leg. `matrix.args` selects the slice (a
      # --grep-invert+--shard bulk slice, or a --grep at-scale lane); the
      # override env is per-leg and empty ('') on bulk legs — playwright.config
      # treats empty as unset, so bulk legs keep the shipped board/collab
      # defaults. workers=1, so this leg's own DB resets never race.
      - name: Run E2E (${{ matrix.id }})
        run: pnpm test:e2e ${{ matrix.args }}
        env:
          # MOTIR-2617 — which cost-derived slice this leg runs. Empty on the
          # a11y / at-scale / billing lanes, which select by --grep instead and
          # must keep seeing every spec file.
          E2E_SHARD: ${{ matrix.shard }}
          BOARD_ISSUE_CAP_OVERRIDE: ${{ matrix.board_issue_cap }}
          DONE_AGE_WINDOW_DAYS_OVERRIDE: ${{ matrix.done_age_window_days }}
          SEED_COLLAB_COMMENTS: ${{ matrix.collab_comments }}
          SEED_COLLAB_CHURN_EDITS: ${{ matrix.collab_churn_edits }}
          SEED_COLLAB_SPREAD_ISSUES: ${{ matrix.collab_spread_issues }}
          SEED_REPORTING_ITEMS: ${{ matrix.seed_reporting_items }}
          SEED_REPORTING_RICH_ITEMS: ${{ matrix.seed_reporting_rich_items }}

      # Always upload the report — pass-runs are useful for debugging flakes, and
      # the report is small. The trace/video/screenshot artifacts only exist for
      # failures (config above). The artifact name MUST be unique per leg or the
      # matrix legs collide on upload (upload-artifact@v4+ errors on a dup name).
      #
      # The path is a GLOB because the non-default lanes write to SUFFIXED report
      # folders: the bulk/at-scale legs use `out/playwright-report`
      # (playwright.config.ts), but the billing lane uses
      # `out/playwright-report-billing`. The old hardcoded
      # `out/playwright-report` matched only the former, so the billing leg
      # silently uploaded NOTHING ("No files were found with the provided path")
      # — a red billing leg left no trace, screenshot, or report to debug from.
      # (The acceptance lane's own `-acceptance` report is uploaded by the
      # `acceptance-video.yml` workflow, which owns that lane since MOTIR-1949.)
      #
      # `out/e2e-harness` is the MOTIR-2617 watchdog series — one JSONL per leg
      # carrying MemAvailable + the webServer's RSS sampled on a timer and at
      # every test boundary, plus each spec's duration. It is what makes a
      # recurrence of the bulk-shard degradation NAME its cliff (and what
      # tests/e2e/shard-plan.ts is re-measured from) instead of being diagnosed
      # from scratch a fourth time. Uploaded on every leg, green or red.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            out/playwright-report*
            out/e2e-harness
          retention-days: 7

  # ── The sandbox image (Story 7.9 · 7.9.7c MOTIR-885 · 7.9.7e MOTIR-1788) ──
  # The BYOK sandbox (`packages/cli/sandbox/`) is the confined container an
  # unattended `motir auto` runs in. Its two claims — "the loop works in here"
  # and "in here is confined" — are only checkable by BUILDING the image and
  # RUNNING it, which is what the called workflow's jobs do. The unit lane's
  # `test/sandbox.test.ts` + `test/sandboxCi.test.ts` guard the sources against
  # drift; these guard the artifact.
  #
  # The matrix itself lives in `sandbox-images.yml` because the RELEASE lane
  # (`release-sandbox.yml`, on a `cli-v*` tag) runs the very same one with its
  # push steps switched on — one definition, two entry points, so nothing can be
  # published that this gate did not build and smoke-test. `publish: false` and
  # the absence of `packages: write` here mean the pull-request lane cannot push
  # even if it tried.
  #
  # Same branch-prefix skip as the Vitest / E2E lanes: a design- or docs-only
  # pull request cannot change what the image does, and a docker matrix is the
  # most expensive thing in this file.

  # ── The AT-SCALE E2E legs, split out of `e2e` (MOTIR-3148) ──────────────────
  #
  # These four legs are self-seeding, cap-parameterised journeys that exercise
  # volume rather than behaviour, and they cost a runner each on every pull
  # request. They now run on push-to-`main` (where they gate `deploy`) and on a
  # pull request that opts in with the `e2e-at-scale` label.
  #
  # WHY A SEPARATE JOB rather than a condition on the legs: a matrix leg cannot
  # be dropped by an expression — the `matrix` context is not available to a
  # job-level `if:` — so the only way to gate a SUBSET of legs is to make that
  # subset its own job. The `e2e` job's comment on the acceptance-video lane
  # records the same constraint from the other side.
  #
  # The bulk legs' `--grep-invert` still excludes these tags, and this job's
  # `--grep` still selects them, so the partition is unchanged: no spec runs
  # twice and none stops being reachable. `tests/e2e-shard-plan.test.ts` reads
  # BOTH job bodies and asserts exactly that.
  e2e-at-scale:
    name: Playwright E2E at-scale (${{ matrix.id }})
    runs-on: ubuntu-latest
    # Observed 5.2–9.9 min across the four at-scale legs → 45 (~4.5x), the same
    # number `e2e` carries and for the same reason: these legs share that job's
    # setup, so they share its wedge.
    timeout-minutes: 45
    permissions:
      contents: read
    needs: [build, changes]
    if: ${{ needs.changes.outputs.app == 'true' && (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e-at-scale')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stories 3.5 + 4.7 — board journeys AT SCALE (Kanban + Scrum). The
          # specs self-seed; these overrides lower the issue cap + Done-age
          # window so the over-cap banner + Done-age trim are reachable with tens
          # of rows instead of 5,000.
          - id: board-at-scale
            args: '--grep "board(-scrum)?-at-scale"'
            board_issue_cap: '40'
            done_age_window_days: '7'
          # Story 5.6 — the collaboration-LOADED issue AT SCALE. These knobs keep
          # the lane fast while every large collection still EXCEEDS its page size
          # (comments 40>20, attachments 64>50, revisions 60+>20) so paging
          # actually engages — the spec's beforeAll fails loud otherwise.
          - id: collab-at-scale
            args: '--grep "collab-at-scale"'
            collab_comments: '40'
            collab_churn_edits: '60'
            collab_spread_issues: '2'
          # Story 6.7 — search / reporting / automation AT SCALE (Subtask 6.7.3).
          # The corpus seed (`db:seed:reporting`) is cap-parameterised; this lane
          # lowers SEED_REPORTING_ITEMS to ~1,000 (still ≫ the 50-row list page,
          # so paging vs. load-all stays distinguishable — the spec's beforeAll
          # fails loud otherwise) and trims the rich subset to keep the seed
          # inside the webServer window. Full 10k runs locally.
          - id: reporting-at-scale
            args: '--grep "epic6-at-scale"'
            seed_reporting_items: '1000'
            seed_reporting_rich_items: '200'
          # Story 8.1 — the billing journeys (Subtask 8.1.10), CLOUD-ON. Billing is
          # MOTIR_CLOUD-gated and turning it on globally would break unrelated specs
          # (the §4 caps + the billing menu row), so it runs as its OWN lane with
          # its OWN cloud-on server (playwright.cloud.config.ts: MOTIR_CLOUD=true +
          # E2E_TEST_BILLING boundary mock, isolated ports). The bulk legs never see
          # billing-cloud.spec.ts (testIgnore'd from the main config); the off-cloud
          # self-host spec (billing-selfhost) rides a normal bulk shard.
          - id: billing-cloud
            args: '--config playwright.cloud.config.ts'
    # Postgres is started by ./.github/actions/postgres (first step below), NOT
    # by a `services:` block — see that action's header for why (MOTIR-1742).
    env:
      # In CI Postgres runs on the standard 5432.
      DATABASE_URL: postgresql://prodect:prodect@localhost:5432/prodect
      # See the build job for the rationale on these throwaway values.
      # Better-Auth's module-load requiredEnv check needs them present;
      # the actual OAuth round-trip is intercepted by the undici MockAgent
      # in instrumentation.ts (E2E_TEST_OAUTH=1 below).
      BETTER_AUTH_SECRET: ci-e2e-only-not-a-real-secret-do-not-reuse
      GOOGLE_CLIENT_ID: ci-e2e-placeholder
      GOOGLE_CLIENT_SECRET: ci-e2e-placeholder
      # Dev-only file email provider — emails appended as JSON lines to
      # EMAIL_OUTBOX_PATH so the credentials spec can capture the reset
      # link. The playwright.config.ts's webServer.env block ALSO sets
      # these on the dev server it spawns, but setting them at the job
      # level too keeps them visible to anyone reading the workflow file.
      EMAIL_PROVIDER: file
      EMAIL_OUTBOX_PATH: /tmp/motir-test-emails.jsonl
      E2E_TEST_OAUTH: '1'
      E2E_TEST_OAUTH_USER_PATH: /tmp/motir-test-oauth-user.json
      # Skip the husky install postinstall — CI has no .git/hooks to wire.
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - name: Start Postgres
        uses: ./.github/actions/postgres
      # pnpm + Node, the three caches, the pre-built `.next/`, migrate deploy and
      # the retrying Playwright install — shared verbatim with the acceptance
      # lane in `acceptance-video.yml` (MOTIR-1949).
      - uses: ./.github/actions/e2e-setup
      # NOTE: the lane's job EXECUTOR needs no setup step of its own. It used to
      # be a vendor dev-server binary — a pinned `inngest-cli` devDependency whose
      # postinstall fetched a 95MB Go binary, allowlisted in pnpm-workspace.yaml
      # so it landed before Playwright's 120s webServer window rather than inside
      # it. MOTIR-3418 retired it: the executor is the app's own worker bundle,
      # started by `globalSetup` from the same source the specs are testing.
      # ONE run step per matrix leg. `matrix.args` selects the slice (a
      # --grep-invert+--shard bulk slice, or a --grep at-scale lane); the
      # override env is per-leg and empty ('') on bulk legs — playwright.config
      # treats empty as unset, so bulk legs keep the shipped board/collab
      # defaults. workers=1, so this leg's own DB resets never race.
      - name: Run E2E (${{ matrix.id }})
        run: pnpm test:e2e ${{ matrix.args }}
        env:
          # MOTIR-2617 — which cost-derived slice this leg runs. Empty on the
          # a11y / at-scale / billing lanes, which select by --grep instead and
          # must keep seeing every spec file.
          E2E_SHARD: ${{ matrix.shard }}
          BOARD_ISSUE_CAP_OVERRIDE: ${{ matrix.board_issue_cap }}
          DONE_AGE_WINDOW_DAYS_OVERRIDE: ${{ matrix.done_age_window_days }}
          SEED_COLLAB_COMMENTS: ${{ matrix.collab_comments }}
          SEED_COLLAB_CHURN_EDITS: ${{ matrix.collab_churn_edits }}
          SEED_COLLAB_SPREAD_ISSUES: ${{ matrix.collab_spread_issues }}
          SEED_REPORTING_ITEMS: ${{ matrix.seed_reporting_items }}
          SEED_REPORTING_RICH_ITEMS: ${{ matrix.seed_reporting_rich_items }}

      # Always upload the report — pass-runs are useful for debugging flakes, and
      # the report is small. The trace/video/screenshot artifacts only exist for
      # failures (config above). The artifact name MUST be unique per leg or the
      # matrix legs collide on upload (upload-artifact@v4+ errors on a dup name).
      #
      # The path is a GLOB because the non-default lanes write to SUFFIXED report
      # folders: the bulk/at-scale legs use `out/playwright-report`
      # (playwright.config.ts), but the billing lane uses
      # `out/playwright-report-billing`. The old hardcoded
      # `out/playwright-report` matched only the former, so the billing leg
      # silently uploaded NOTHING ("No files were found with the provided path")
      # — a red billing leg left no trace, screenshot, or report to debug from.
      # (The acceptance lane's own `-acceptance` report is uploaded by the
      # `acceptance-video.yml` workflow, which owns that lane since MOTIR-1949.)
      #
      # `out/e2e-harness` is the MOTIR-2617 watchdog series — one JSONL per leg
      # carrying MemAvailable + the webServer's RSS sampled on a timer and at
      # every test boundary, plus each spec's duration. It is what makes a
      # recurrence of the bulk-shard degradation NAME its cliff (and what
      # tests/e2e/shard-plan.ts is re-measured from) instead of being diagnosed
      # from scratch a fourth time. Uploaded on every leg, green or red.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            out/playwright-report*
            out/e2e-harness
          retention-days: 7

  # ── The sandbox image (Story 7.9 · 7.9.7c MOTIR-885 · 7.9.7e MOTIR-1788) ──
  # The BYOK sandbox (`packages/cli/sandbox/`) is the confined container an
  # unattended `motir auto` runs in. Its two claims — "the loop works in here"
  # and "in here is confined" — are only checkable by BUILDING the image and
  # RUNNING it, which is what the called workflow's jobs do. The unit lane's
  # `test/sandbox.test.ts` + `test/sandboxCi.test.ts` guard the sources against
  # drift; these guard the artifact.
  #
  # The matrix itself lives in `sandbox-images.yml` because the RELEASE lane
  # (`release-sandbox.yml`, on a `cli-v*` tag) runs the very same one with its
  # push steps switched on — one definition, two entry points, so nothing can be
  # published that this gate did not build and smoke-test. `publish: false` and
  # the absence of `packages: write` here mean the pull-request lane cannot push
  # even if it tried.
  #
  # Same branch-prefix skip as the Vitest / E2E lanes: a design- or docs-only
  # pull request cannot change what the image does, and a docker matrix is the
  # most expensive thing in this file.

  sandbox:
    name: Sandbox images
    needs: changes
    if: ${{ needs.changes.outputs.images == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/sandbox-images.yml
    with:
      publish: false

  # ── The CI runner image (MOTIR-1916 · MOTIR-1978) ─────────────────────────
  # `infra/ci-runner/` is what every ephemeral fleet runner boots from — the
  # value `MOTIR_RUNNER_IMAGE` names and `lib/orchestrator/adapters/fly/
  # flyMachines.ts` refuses to start without. Its claims are the same shape as
  # the sandbox's and are checkable the same way: that nothing in it floats
  # (§7.2), that it holds no registration capability (§7.4), and that a runner
  # container can actually run a `services:` container the way the starters'
  # workflows use one. All three need the image BUILT, so they live here rather
  # than in the unit lane; `test/ciRunnerImage.test.ts` guards the sources
  # against drift the way `sandboxCi.test.ts` does for the sandbox.
  #
  # Same one-definition-two-entry-points shape: `release-runner-image.yml` (on a
  # `runner-v*` tag) runs this very workflow with `publish: true`. `publish:
  # false` and the absence of `packages: write` here mean the pull-request lane
  # cannot push even if it tried.
  #
  # Same branch-prefix skip as the lanes above — a design- or docs-only pull
  # request cannot change what the image does.

  runner-image:
    name: Runner image
    needs: changes
    if: ${{ needs.changes.outputs.images == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/runner-image.yml
    with:
      publish: false

  # ── Ship it — the deploy runs AFTER the gates, never beside them (MOTIR-2390)
  #
  # The pipeline order is `docs/decisions/application-hosting.md` §6 (Q5): the
  # suite that exists is the gate, it is untouched by this job, and the deploy
  # follows it. Two conditions do that, and both are load-bearing:
  #
  #   • `needs:` — every app-level gate above. A skipped or failed need makes
  #     this job skip (there is deliberately no `always()` here), so a red
  #     Vitest shard or a red E2E leg means nothing ships. The package lanes
  #     (`design-system`, `cli`) and the image lanes (`sandbox`, `runner-image`)
  #     are NOT in the list: each is released by its own tag and none of them is
  #     part of this service's artifact — the same reasoning motir-ai's deploy
  #     uses to exclude `indexer-image`. `design-guards` is out for that same
  #     reason and not by oversight: `design/` is not in the standalone bundle,
  #     so a stale mockup cannot reach the running service. (It used to be
  #     PRUNED there; since MOTIR-3219 it is never traced in, and the Dockerfile
  #     step asserts that rather than deleting it. Same guarantee, earlier.)
  #     It still gates the MERGE — `ci-complete` needs it like everything else.
  #   • `if:` — the default branch, on a real push. A pull request's `github.ref`
  #     is `refs/pull/<n>/merge`, so a PR cannot deploy even by targeting main.
  #
  # `flyctl deploy` runs fly.toml's `release_command` (`prisma migrate deploy`
  # via /app/migrate) as part of the release, in a temporary machine built from
  # the same image, BEFORE any new machine takes traffic — so a migration cannot
  # race a half-rolled-out release, and a non-zero release command rolls the
  # deploy back.
  #
  # ⚠️ Merging a change here (or any change to `main`) DEPLOYS. That is the
  # point, and it is also why the first merge after this job lands is a real
  # production release: MOTIR-2392 is the card that watches it.

  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test, coverage, e2e, e2e-at-scale]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # A release must NOT be cancelled mid-flight by a newer push — the
    # workflow-level `cancel-in-progress` is right for a test run and wrong for
    # a deploy, so this group overrides it.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    # A backstop, not an expectation: the image build plus the release takes
    # single-digit minutes.
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The Fly app name, which is also its Fly-owned hostname
      # (`<app>.fly.dev`). Every check below reads THAT rather than the custom
      # domain, so this job proves the release itself and not a DNS record.
      FLY_APP: motir-core
    steps:
      - uses: actions/checkout@v6
      # For the pool guard below, which is a Node script so its derivation can be
      # unit-tested rather than trusted. Same version as every other job here.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # `--local-only` builds on the runner's own Docker daemon and pushes to
      # registry.fly.io, instead of Fly's remote/Depot builder — which flaked
      # with repeated 503s for motir-ai even while Fly itself was operational.
      # The trade is that the Dockerfile's `node:22-slim` bases come from Docker
      # Hub anonymously; if that becomes the flake, the mirror composite
      # (`.github/actions/buildx`, MOTIR-2018) is where the fix belongs.
      # ⚠️ FAIL HERE RATHER THAN SHIP A BLIND RELEASE (Subtask 8.5.6 /
      # MOTIR-1162). Every value below is a GitHub Actions secret set by
      # MOTIR-1161, and each one that is missing degrades monitoring SILENTLY:
      # an empty `NEXT_PUBLIC_SENTRY_DSN` builds a browser bundle that reports
      # nothing, an empty `SENTRY_AUTH_TOKEN` ships stack traces nobody can
      # read. Nothing errors, no check goes red, and the gap is only visible
      # months later on a surface this pipeline never opens. So the release
      # stops instead.
      - name: Assert the monitoring build-time secrets are present
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          missing=""
          for name in NEXT_PUBLIC_SENTRY_DSN SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing monitoring secret(s):$missing — see MOTIR-1161's provisioning record for the value and its home. Refusing to deploy an unmonitored release."
            exit 1
          fi
          echo "all four monitoring build-time secrets are present"

      # ⚠️ THE BUILD ARGUMENTS ARE NOT OPTIONAL EXTRAS — they are the ONLY way
      # the browser half of monitoring gets configured, because `next build`
      # inlines a `NEXT_PUBLIC_*` value into the client bundle and a Fly runtime
      # secret cannot reach it (MOTIR-1161's warning table; the `Dockerfile`'s
      # `ARG` block is the receiving end). `MOTIR_RELEASE` is the same story for
      # the release name: source maps are uploaded DURING this build and must
      # carry the string the running code reports, `.git` is in `.dockerignore`
      # so the SDK's own `git rev-parse` fallback finds nothing, and Fly's
      # runtime `FLY_*` variables identify the machine rather than the build.
      #
      # The AUTH TOKEN goes through `--build-secret`, not `--build-arg`: a build
      # argument is recorded in the build's metadata and a credential must not
      # be. The Dockerfile mounts it for the single `next build` command.
      - name: Build the image and release it
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          flyctl deploy --local-only --app "$FLY_APP" \
            --build-arg "NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN" \
            --build-arg "MOTIR_RELEASE=$GITHUB_SHA" \
            --build-arg "SENTRY_ORG=$SENTRY_ORG" \
            --build-arg "SENTRY_PROJECT=$SENTRY_PROJECT" \
            --build-secret "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN" \
            2>&1 | tee /tmp/fly-deploy.log

      # ⚠️ "CONFIGURED" IS NOT "RAN", AND THIS REPO HAS THE SCAR TO PROVE IT.
      # `next.config.ts` already carries one key — `outputFileTracingExcludes` —
      # that Turbopack never reads: it pruned nothing for months while reading as
      # solved (MOTIR-2403). Source-map upload is the same shape of risk, so this
      # card's acceptance asks for the upload to be DEMONSTRATED rather than
      # configured, and asking once at authoring time would only cover today.
      #
      # The hard gate is the RELEASE existing in Sentry. `@sentry/nextjs`'s
      # Turbopack path creates it inside the same `runAfterProductionCompile`
      # hook that then uploads the maps, so a release named after this commit is
      # positive evidence the hook ran with a working token — and its absence is
      # exactly the regression (a hook that silently stopped being invoked, a
      # token that expired) that would otherwise surface as unreadable stack
      # traces during an incident.
      #
      # The upload line is reported but NOT gated on: it is the bundler plugin's
      # own wording and travels through flyctl's build-output rendering, so
      # making a production release depend on that string would trade a real
      # check for a brittle one.
      - name: Assert Sentry received this release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          if grep -qF 'Successfully uploaded source maps to Sentry' /tmp/fly-deploy.log; then
            echo "build log: source maps uploaded"
          else
            echo "build log: no upload line seen (flyctl may not surface it) — the release check below is the gate"
          fi
          code=$(curl -sS -o /tmp/sentry-release.json -w '%{http_code}' \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/releases/$GITHUB_SHA/")
          echo "GET releases/$GITHUB_SHA → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Sentry has no release named $GITHUB_SHA. The source-map upload did not run — stack traces from this deploy will not be symbolicated. See next.config.ts's monitoring block for how the Turbopack upload path is wired."
            exit 1
          fi
          head -c 400 /tmp/sentry-release.json; echo

      # ── Post-deploy verification: three things only a real release can show ──
      #
      # Deliberately NOT a second E2E suite. The deployed app's only database is
      # production, and the specs truncate what they connect to (ADR §6's
      # rejected alternatives). What is left is still every configuration
      # failure worth catching: is the process up, can it be reached by the one
      # caller that talks to it, and does the platform have the machines this
      # repository believes it does.
      - name: Assert the release answers
        run: |
          set -euo pipefail
          url="https://${FLY_APP}.fly.dev/sign-in"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
            echo "attempt $attempt → GET $url → HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::$url did not answer 200 after 5 attempts — the release is not serving."
          exit 1

      # ⚠️ A FUNCTION-REGISTRATION STEP STOOD HERE (MOTIR-3418 removed it). The
      # vendor's control plane held its own registry of this app's functions, and
      # it went stale silently — five production jobs stayed dead for a month
      # (MOTIR-1970) — so the deploy PUT the serve route and failed red if the sync
      # did. The engine has no second registry to keep in step: the worker reads
      # `lib/jobs/registry.ts` out of the image it is running, so a job is
      # registered by being deployed and cannot be registered any other way.
      #
      # The repository variable that held the serve URL is now unread; it can be
      # deleted from the repo's variables at leisure.

      # ⚠️ Read the OBSERVATION from the PLATFORM, never from `fly.toml`. A config
      # file is a claim about the deployment, not a reading of it: motir-ai's
      # fly.toml promised load spilling onto fresh machines while production ran
      # ONE machine for weeks, because `auto_start_machines` never CREATES one and
      # no card had run `fly scale count` (MOTIR-2102 — three days of an incident
      # filed against the wrong service, closed by one authenticated GET). Every
      # number this step compares still comes from
      # `GET /v1/apps/<app>/machines`; what `fly.toml` supplies is the EXPECTATION.
      #
      # ⚠️ AND THE EXPECTATION IS DERIVED, NOT STORED (MOTIR-3570). This step used
      # to assert Fly's total `machine_count` against the repo variable
      # `FLY_EXPECTED_MACHINE_COUNT`, which MOTIR-2408 set to 2 when the pool WAS
      # two app machines. MOTIR-3425 added the `worker` process group, the pool
      # became four, and nothing updated the variable — so every deploy ended RED
      # on a deploy that had SUCCEEDED: the image released, the release answered,
      # the functions synced, three migrations applied. `CI complete` went red and the
      # trunk's red stopped saying anything about whether the trunk is deployed,
      # which is the most expensive direction for a check to fail in.
      #
      # Re-arming the variable would only buy the interval until the next group.
      # A SUM is the wrong assertion for a pool that is now a sum over process
      # groups scaled independently: it cannot tell `app=2, worker=2` from
      # `app=1, worker=3`, which halves the web tier at an unchanged total. So
      # `scripts/assert-machine-pool.mjs` derives the SHAPE from `fly.toml` —
      # `[processes]` names the groups that must exist, `http_service.processes`
      # + `min_machines_running` name the running floor for the tier that serves
      # traffic — and adding or scaling a group updates the expectation by
      # construction. There is no repo variable left to go stale, and
      # `tests/scripts/assert-machine-pool.test.ts` proves the derivation still
      # goes red on real drift with deliberate negatives rather than with the
      # absence of a failure.
      - name: Assert the machine pool against fly.toml, read from Fly's API
        run: node scripts/assert-machine-pool.mjs --app "$FLY_APP"

  # ── The one required status check on `main` (MOTIR-2008) ──────────────────
  # `protect-main` (ruleset 17227448) requires exactly ONE context: `CI complete`.
  # Everything above is gated THROUGH this job rather than by name, because
  # naming jobs directly could only ever cover the five unconditional,
  # non-matrix ones (MOTIR-2003). Two measured reasons, both from a real skipped
  # run (PR #1766, `design/MOTIR-1811-ai-callout-menu`):
  #
  #   • A skipped MATRIX job reports ONE check run under the RAW, un-interpolated
  #     name — literally `Vitest (${{ matrix.shard }}/${{ matrix.total }})`, not
  #     `Vitest (1/3)`. Requiring the shard names would leave those contexts
  #     permanently absent on every `seed/` / `design/` / `docs/` PR — the very
  #     prefixes that exist to skip those jobs — and wedge them unmergeably.
  #   • A job skipped because its dependency FAILED also reports `skipped`, and a
  #     skipped required check counts as SATISFIED. `coverage` is `needs: test`,
  #     so requiring it would have been satisfied by a red test run.
  #
  # Aggregating here fixes both: this job's own name never interpolates anything,
  # so a shard rebalance or a job rename cannot wedge a PR, and the step below
  # reads each need's `result` rather than trusting the check-run's presence — so
  # Vitest and E2E are mechanically gated for the first time.
  #
  # `needs` MUST list every other job in this file. A job added later and left
  # out is silently un-gated; `tests/ci-complete-gate.test.ts` asserts the list
  # against the workflow's actual job keys (a predicate, not a fixed count) so
  # that omission fails CI instead of shipping.

  ci-complete:
    name: CI complete
    # WHY `always()` AND an explicit result assertion — neither alone works:
    #   • Without `always()` this job would be SKIPPED whenever any need is
    #     skipped (a skipped `needs` job makes its dependents skip, not fail), so
    #     every `docs/`/`design/`/`seed/` PR would leave the required context
    #     absent and unmergeable — and a skipped required check counts as
    #     satisfied anyway, so the gate would also pass over a red `test` run.
    #   • `always()` ALONE is worse: it removes the implicit "all needs
    #     succeeded" condition, so this job would run — and go GREEN — with a
    #     FAILED or CANCELLED need. Hence the step, which is what actually turns
    #     `failure` / `cancelled` into a red gate.
    if: always()
    needs:
      [
        changes,
        lint,
        structural-guards,
        typecheck,
        design-system,
        design-guards,
        cli,
        build,
        test,
        coverage,
        e2e,
        e2e-at-scale,
        sandbox,
        runner-image,
        deploy,
      ]
    runs-on: ubuntu-latest
    # Observed <0.1 min → 10 (the short-job floor). It reads the `needs`
    # context and exits. The clock starts when the job STARTS, so waiting for
    # fifteen other jobs costs it nothing.
    timeout-minutes: 10
    # Reads nothing, writes nothing — it only inspects the `needs` context.
    permissions: {}
    steps:
      - name: Assert every needed job succeeded or was skipped
        # `toJSON(needs)` goes through the environment rather than being spliced
        # into the script, so no job name or result can be interpreted as shell.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          # Capture first, THEN test: a `jq | grep`-style pipeline under
          # `pipefail` reports the wrong command's status when the interesting
          # command is the one allowed to find nothing.
          bad=$(jq -r 'to_entries[]
                       | select(.value.result != "success" and .value.result != "skipped")
                       | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            while read -r line; do
              echo "::error::CI incomplete — job ${line%%=*} finished as ${line#*=}"
            done <<<"$bad"
            exit 1
          fi
          echo "Every job in this workflow succeeded or was skipped."
