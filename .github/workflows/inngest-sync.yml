# Register the deployed function list with Inngest — the MANUAL re-sync.
#
# ⚠️ THE DEPLOY-TIME SYNC IS NOT HERE ANY MORE (MOTIR-2390). It is a step of
# `ci.yml`'s `deploy` job, which runs it after the Fly release is live and fails
# the job when it does not succeed. Both entry points call ONE definition,
# `.github/actions/inngest-sync`, so the retry loop and the 200 assertion cannot
# drift apart.
#
# Why the trigger changed: this workflow used to fire on `deployment_status`, an
# event **Vercel** raises. motir-core no longer runs on Vercel, and Fly raises no
# such event, so the trigger would simply have stopped firing — reproducing the
# exact silent failure the workflow was created to fix
# (`docs/decisions/application-hosting.md` §6). What remains here is the
# hand-operated path, for the cases no deploy covers: a `flyctl deploy` run from
# a laptop, a restored-from-backup Inngest app, a rotated signing key.
#
# Why the sync exists at all (MOTIR-1970)
# ---------------------------------------
# Inngest only invokes functions it has been TOLD about. The registration is a
# PUT to the app's `/api/inngest`, and until this workflow existed the only
# thing issuing it was the Inngest↔Vercel integration, which probed the
# per-deployment `motir-core-<hash>.vercel.app` URL. That probe could not work:
# the Vercel project ran Deployment Protection at `all_except_custom_domains`,
# so every `*.vercel.app` deployment URL answered the integration with a 302
# into Vercel's SSO login and the request never reached the app. Only the custom
# domain was exempt.
#
# The consequence was invisible: events for the un-registered functions were
# ACCEPTED and consumed by nothing. `inngest.send()` succeeded, no run was
# created, no `job_run` row was written, nothing errored. Five jobs were dead in
# production for a month — `system.code-graph-index`, `system.code-graph-refresh`,
# `system.auto-plan-cadence-tick`, `system.ci-minutes-reconcile` and
# `system.ci-actions-gate-sweep` — while every feature built on them shipped
# green. (This is MOTIR-66 recurring: that card fixed the PREVIEW probe with a
# protection-bypass secret; production deployment URLs were never covered.)
#
# So Motir issues the sync ITSELF, against the custom domain — and FAILS when
# the PUT does not succeed. That is the point: the previous failure mode was a
# sync that could go wrong without producing any signal at all. A red check is
# the signal.
#
# This is the deploy-time fix's manual twin. The runtime half is the schedule-
# health probe in `system.daily-health-check` (lib/services/jobScheduleHealth
# Service.ts), which catches the fault even if neither path runs.

name: Inngest sync

on:
  workflow_dispatch:

# One sync at a time. Unlike the deploy-time step, a manual run is never
# superseded by a newer one automatically, so it queues rather than cancelling.
concurrency:
  group: inngest-sync
  cancel-in-progress: false

jobs:
  register:
    name: Register functions with Inngest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: PUT the serve route
        uses: ./.github/actions/inngest-sync
        with:
          # The CUSTOM domain, deliberately — it is where Inngest invokes the
          # functions. Overridable via a repo variable so a domain change does
          # not need a code change.
          serve-url: ${{ vars.INNGEST_SERVE_URL || 'https://app.motir.co/api/inngest' }}
