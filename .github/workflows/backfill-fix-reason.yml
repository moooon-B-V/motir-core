name: Backfill work-item fix reason

# Manual operator action (Story MOTIR-6588 · MOTIR-6603): recompute
# `WorkItem.fixReason` for every live card through the shipped recompute
# (`fixReasonService.recomputeWorkItemFixReason`) — the SAME function the live path
# calls, which reads `motir fix`'s own predicate. Never a rule re-implemented here.
#
# WHY A BACKFILL. The wiring (MOTIR-6602) recomputes the reason on every future
# event. A card already stuck when it deploys has no next event coming, so it would
# read `null` for ever and never reach the Workbench's To fix tab.
#
# IDEMPOTENT + SAFE TO RE-RUN: the recompute writes only when the value changed, so
# a second run reports `changed: 0`. Each card commits in its own transaction.
# `workflow_dispatch` ONLY, mirroring `backfill-ci-state.yml`: a data backfill is an
# explicit operator decision. Running it on production is MOTIR-6601.
#
# DEFAULTS TO A DRY RUN — read the per-reason counts before applying.
#
# Inert until the SEED_DATABASE_URL secret is set: the guard step detects the
# missing secret and SKIPS (the job stays green with a notice).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse only — derive and print, write nothing'
        type: boolean
        required: false
        default: true

# Never run two backfills at once. Each is idempotent, but two sweeps recomputing
# the same card concurrently would contend on its row lock for no benefit. One
# at a time; don't cancel an in-flight run, which would leave a partial sweep
# whose progress is fine but whose report nobody sees.
concurrency:
  group: backfill-fix-reason
  cancel-in-progress: false

jobs:
  backfill:
    name: Recompute WorkItem.fixReason for every live card
    runs-on: ubuntu-latest
    # The ciState sweep's measured floor (MOTIR-5765: ~9 min over ~1,957 cards,
    # cancelled by a 10-minute ceiling) is the reason for the same 60-minute
    # headroom here. This sweep's candidates are the in-progress-category cards,
    # a smaller set; its `progress` lines are the measurement to tighten from.
    timeout-minutes: 60
    env:
      # The production (unpooled) Neon connection string — the SAME secret the
      # reseed and board backfills use. Empty when unset; the guard step skips.
      DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
      # Defensive parity with the sibling backfills: this script does not import
      # the Better-Auth instance today, but wiring them costs nothing and keeps
      # the job working if a transitive import ever pulls it in (its requiredEnv
      # check needs all three at module load). The GOOGLE_* values only register
      # the OAuth provider; no round-trip happens.
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: backfill-placeholder
      GOOGLE_CLIENT_SECRET: backfill-placeholder
      # No git hooks to wire in CI.
      HUSKY: '0'
    steps:
      # Gate the whole job on the secret being present. `secrets.*` can't be used
      # in a job/step `if:`, but a step CAN read it into an env var and branch —
      # so an unconfigured repo skips (green) instead of failing at migrate.
      - name: Check SEED_DATABASE_URL is configured
        id: guard
        env:
          SEED_DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
        run: |
          if [ -z "$SEED_DATABASE_URL" ]; then
            echo "::notice::SEED_DATABASE_URL is not set — skipping the fix-reason backfill. Add it under Settings → Secrets and variables → Actions to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v6
      - if: steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/pnpm
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm prisma generate
      # Make sure the target DB carries the `fixReason` columns (and every table
      # the rule reads) before sweeping it.
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm prisma migrate deploy
      # The `--dry-run` flag is passed only when the input is true, so clearing
      # the checkbox is what applies the sweep. Written as a shell branch rather
      # than an expression-interpolated argument: an empty interpolation would
      # pass an EMPTY STRING, which the script's own argument parser rejects as
      # an unknown argument — correctly, but with a confusing message.
      - if: steps.guard.outputs.enabled == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "false" ]; then
            echo "::warning::Applying the fix-reason backfill — this WRITES."
            pnpm db:backfill:fix-reason
          else
            pnpm db:backfill:fix-reason --dry-run
          fi
