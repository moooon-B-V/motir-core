# Workspace packages. The Next app lives at the repo root; `packages/*` holds
# the workspace packages — the first is `@motir/cli` (Subtask 7.9.1), the
# terminal MCP client. The root app build is unaffected by their presence.
packages:
  - 'packages/*'

allowBuilds:
  # @parcel/watcher + @swc/core arrive as OPTIONAL deps of next-intl (its
  # experimental build-time SWC message plugin + file watcher). The cookie-based
  # setup never uses that tooling — `next build` runs fine with these native
  # builds skipped — so set false to silence pnpm 11's ERR_PNPM_IGNORED_BUILDS
  # gate deterministically (same rationale as protobufjs below). Without this,
  # `pnpm install` exits 1 on CI/Vercel.
  '@parcel/watcher': false
  '@swc/core': false
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  # @sentry/cli's postinstall is a FALLBACK DOWNLOADER, and in this tree it is a
  # verified no-op — so `false` silences pnpm's ERR_PNPM_IGNORED_BUILDS gate
  # without withholding anything (MOTIR-1162). It arrives as a dependency of
  # @sentry/bundler-plugin-core, which the Next SDK uses to upload source maps.
  #
  # The binary does NOT come from that script. It comes from one of eight
  # per-platform OPTIONAL dependencies (`@sentry/cli-linux-x64` on CI,
  # `@sentry/cli-linux-arm64` on this box) — plain files, no build step — and all
  # eight are in the lockfile, so pnpm installs the right one on either arch. The
  # last lines of `scripts/install.js` are explicit about it: it
  # `require.resolve`s the platform package and `process.exit(0)`s when that
  # succeeds, downloading from the Sentry CDN only when optional dependencies
  # were skipped (`--no-optional` and friends).
  #
  # ⚠️ Getting this wrong would be SILENT — a missing binary means source maps
  # simply do not upload, and a deploy with unreadable stack traces looks exactly
  # like a healthy one. So it is not left to the argument above:
  # `tests/monitoring/sentry-wiring.test.ts` resolves the binary the way the
  # upload path does and asserts it exists on disk.
  '@sentry/cli': false
  inngest-cli: set this to true or false
