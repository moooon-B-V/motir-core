# Workspace packages. The Next app lives at the repo root; `packages/*` holds
# the workspace packages — the first is `@motir/cli` (Subtask 7.9.1), the
# terminal MCP client. The root app build is unaffected by their presence.
packages:
  - 'packages/*'

allowBuilds:
  # @parcel/watcher + @swc/core arrive as OPTIONAL deps of next-intl (its
  # experimental build-time SWC message plugin + file watcher). The cookie-based
  # setup never uses that tooling — `next build` runs fine with these native
  # builds skipped — so set false to silence pnpm 11's ERR_PNPM_IGNORED_BUILDS
  # gate deterministically (same rationale as protobufjs below). Without this,
  # `pnpm install` exits 1 on CI/Vercel.
  '@parcel/watcher': false
  '@swc/core': false
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  # @sentry/cli's postinstall is a FALLBACK DOWNLOADER, and in this tree it is a
  # verified no-op — so `false` silences pnpm's ERR_PNPM_IGNORED_BUILDS gate
  # without withholding anything (MOTIR-1162). It arrives as a dependency of
  # @sentry/bundler-plugin-core, which the Next SDK uses to upload source maps.
  #
  # The binary does NOT come from that script. It comes from one of eight
  # per-platform OPTIONAL dependencies (`@sentry/cli-linux-x64` on CI,
  # `@sentry/cli-linux-arm64` on this box) — plain files, no build step — and all
  # eight are in the lockfile, so pnpm installs the right one on either arch. The
  # last lines of `scripts/install.js` are explicit about it: it
  # `require.resolve`s the platform package and `process.exit(0)`s when that
  # succeeds, downloading from the Sentry CDN only when optional dependencies
  # were skipped (`--no-optional` and friends).
  #
  # ⚠️ Getting this wrong would be SILENT — a missing binary means source maps
  # simply do not upload, and a deploy with unreadable stack traces looks exactly
  # like a healthy one. So it is not left to the argument above:
  # `tests/monitoring/sentry-wiring.test.ts` resolves the binary the way the
  # upload path does and asserts it exists on disk.
  '@sentry/cli': false
  inngest-cli: set this to true or false

# MOTIR-7171 — better-auth 1.7.7 (and the @better-auth/* set it peer-requires)
# was published 2026-09-30, inside pnpm's minimum-release-age window, and the
# CIMD plugin MOTIR-7170 needs exists only on the 1.7 line. Pinned exactly, so
# each entry names one immutable version; drop them once they have aged.
minimumReleaseAgeExclude:
  - '@better-auth/cimd@1.7.7'
  - '@better-auth/core@1.7.7'
  - '@better-auth/drizzle-adapter@1.7.7'
  - '@better-auth/kysely-adapter@1.7.7'
  - '@better-auth/memory-adapter@1.7.7'
  - '@better-auth/mongo-adapter@1.7.7'
  - '@better-auth/oauth-provider@1.7.7'
  - '@better-auth/passkey@1.7.7'
  - '@better-auth/prisma-adapter@1.7.7'
  - '@better-auth/telemetry@1.7.7'
  - better-auth@1.7.7

# `next` VENDORS the React the App Router renders with, and 16.2.6's copy
# dropped a Suspense ping that lands during render (MOTIR-5255), so it carried a
# patch with React's upstream fix. next 16.3.x vendors the fixed build, and
# MOTIR-7816 removed the patch on the bump to 16.3.6 after
# `tests/react-dom-ping-patch.test.ts` passed on the unpatched install. That test
# still guards the vendored build on every later bump.
#
# ⚠️ `mcp-handler@1.1.0` pumps each `/api/mcp` POST's SSE body into a stream of
# its own and enqueues into it unguarded, so a client that disconnects while a
# tool is still running throws "Invalid state: Controller is already closed" as an
# unhandled rejection (MOTIR-5857). The patch gives that stream a `cancel` and
# drops writes after it closes. It also fires the POST handler with `void`, so a
# body read that rejects because the client hung up first (`Error: aborted`) was
# an unhandled rejection too (MOTIR-6853): the patch rejects the route's Response
# instead, while no head has been written, and `lib/mcp/clientAbort.ts` answers
# it. 1.1.0 is the last 1.x; 2.x moves to `@modelcontextprotocol/server` v2. On
# a bump, delete the entry only if `tests/mcp/stream-cancel.test.ts` AND
# `tests/mcp/body-abort.test.ts` pass on the unpatched install. Its peer range
# pins `@modelcontextprotocol/sdk@1.26.0`; the app runs 1.31.0 (MOTIR-7816, the
# OAuth-client advisory fixed in 1.31.0) and `pnpm peers check` reports that
# mismatch on purpose — both tests above pass against 1.31.0.
patchedDependencies:
  mcp-handler@1.1.0: patches/mcp-handler@1.1.0.patch

# MOTIR-7816 — security floors for TRANSITIVE dependencies. Each entry lifts
# only the versions a Dependabot advisory names (`<fix`) to its first patched
# release, so a parent that already resolves a fixed version is untouched. Three
# cross a breaking boundary because the advisory left no fix on the old line:
# `deepmerge-ts` 7 → 8 (only `@prisma/config` uses it), `sharp` 0.34 → 0.35 and
# `esbuild` 0.27 → 0.28 (build tooling). Drop an entry once every parent's own range resolves at or
# above its floor (`pnpm why -r <name>` shows who still pins it low).
overrides:
  '@babel/core@<7.29.6': ^7.29.6
  '@hono/node-server@<1.19.15': ^1.19.15
  'baseline-browser-mapping@<2.11.0': ^2.11.0
  'body-parser@>=2 <2.3.0': ^2.3.0
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=2 <2.1.7': ^2.1.7
  'brace-expansion@>=3 <5.0.12': ^5.0.12
  'deepmerge-ts@<8.0.0': ^8.0.0
  'esbuild@>=0.27.3 <0.28.1': ^0.28.1
  'fast-uri@<3.1.8': ^3.1.8
  'find-my-way@<9.7.0': ^9.7.0
  'hono@<4.13.7': ^4.13.7
  'ip-address@<10.7.1': ^10.7.1
  'js-yaml@>=4 <4.3.2': ^4.3.2
  'linkify-it@<5.0.2': ^5.0.2
  'markdown-it@<14.3.1': ^14.3.1
  'mysql2@<3.23.1': ^3.23.1
  'nanoid@<3.3.18': ^3.3.18
  'next@<16.3.6': 16.3.6
  'postcss@<8.5.23': ^8.5.23
  'proxy-addr@<2.0.8': ^2.0.8
  'qs@<6.16.0': ^6.16.0
