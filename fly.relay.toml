# motir-relay on Fly.io — the agent terminal's WebSocket relay (Story MOTIR-6861 ·
# MOTIR-6940).
#
# The decision this file implements is `docs/decisions/agent-terminal.md` Q1:
# browser → `wss://relay.motir.co/v1/terminal` → this app → the one agent machine's
# terminal server. Its code is `lib/agentTerminal/relay/*` behind
# `scripts/relay.ts`.
#
# ⚠️ THIS FILE CONFIGURES; IT DOES NOT PROVISION. The app, its certificate for
# `relay.motir.co` and its secrets are created by the manual card the decision
# owes beside MOTIR-6940 ("Owed on acceptance"). Until that card is done the
# deploy job skips this app (`MOTIR_RELAY_ENABLED`, see `ci.yml`).
#
# ⚠️ WHY A SEPARATE APP AND NOT A PROCESS GROUP IN `fly.toml`. A Fly app routes by
# PORT, not by path, and 443 already belongs to motir-core's `http_service`
# (`processes = ["app"]`). A relay group there would have to answer on a port like
# 8443, which many corporate proxies block for WebSockets. And a custom server in
# the web process is out: Next's standalone output and a custom server "cannot be
# used together" (Q1's rejected alternatives).

app            = "motir-relay"  # org `moooon`, beside motir-core. Created by the
                                # manual card, not by this file.
primary_region = "iad"          # Ashburn — with motir-core and the database the
                                # relay reads on every connection.

# ⚠️ THE SAME IMAGE AS motir-core, NEVER BUILT HERE. The deploy job releases
# motir-core first (which builds and pushes the image and runs the migrations),
# then deploys THIS app with `flyctl deploy --image <that same ref>`. So there is
# no `[build]` section to keep in step with `fly.toml`'s, and the relay can never
# run code a different commit from the web app it serves.

# ⚠️ NO `release_command`. motir-core's release already migrated the database
# this app reads; a second migrate would race it for nothing.

[processes]
  # One file, bundled by `pnpm build:relay` and staged at /app/relay by the
  # Dockerfile — the worker's shape (`fly.toml`'s [processes] block says why a
  # bundle and not source).
  relay = "node relay/relay.mjs"

[env]
  PORT = "8080"
  # Secrets, set on the app by the manual card and NEVER here: DATABASE_URL,
  # MOTIR_TERMINAL_MASTER_KEY (the same value as motir-core's), MOTIR_BASE_URL
  # (the one Origin a browser may connect from) and SENTRY_DSN. It holds NO Fly
  # token: the relay never starts, stops or execs a machine (Q1, Q6).

# ── THE ONE PUBLIC SERVICE: 443, TLS terminated at Fly's edge ─────────────────
#
# `[[services]]` rather than `[http_service]` because the unit here is a
# CONNECTION, not a request: a terminal holds its socket open for as long as the
# panel is open, so concurrency is counted in connections.
[[services]]
  processes     = ["relay"]
  internal_port = 8080
  protocol      = "tcp"
  # ⚠️ NEVER STOPPED BY THE PROXY. A stopped relay drops every open terminal;
  # the shells survive on the agents (Q5), but every panel reconnects at once.
  auto_stop_machines   = "off"
  auto_start_machines  = true
  # At least one running (Q1). A deploy or a crash drops only the transport, and
  # the panel reconnects to the same shell with its session token.
  min_machines_running = 1

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  # ⚠️ THE NUMBERS ARE NOT MEASURED. A connection is two sockets and a few KB of
  # buffers; 500/1000 on a 512 MB shared CPU is an estimate labelled as one.
  # TRIGGER to revise: the first sustained connection-count or memory reading
  # from Fly metrics.
  [services.concurrency]
    type       = "connections"
    soft_limit = 500
    hard_limit = 1000

  # `/healthz` answers 200 and nothing else; every other path but the
  # `/v1/terminal` upgrade is a 404.
  [[services.http_checks]]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "10s"
    method       = "get"
    path         = "/healthz"

# Q1: shared-cpu-1x, 512 MB. The relay holds no state and parses only small JSON
# control frames; its resident set is the bundle plus Prisma.
[[vm]]
  size      = "shared-cpu-1x"
  memory    = "512mb"
  cpus      = 1
  processes = ["relay"]
