services:
  postgres:
    # pgvector/pgvector (Postgres 16 + pgvector preinstalled) — Story MOTIR-2694 ·
    # Subtask MOTIR-2696 adds `work_item_embedding`, whose migration runs
    # `CREATE EXTENSION vector`; the vanilla `postgres:16-alpine` this used to run
    # does not ship the extension, so that migration fails on it outright. Same PG
    # major, so this is an image swap and not an upgrade — but the extension
    # `.so`/control files live in the IMAGE, not the volume, so an existing
    # container must be recreated (`docker compose up -d --force-recreate
    # postgres`); the data volume itself does not need to be dropped.
    #
    # `motir-ai` hit this exact wall in 20260624000000_enable_pgvector and made the
    # same move (its `docker-compose.yml` carries the same note). Keep this tag in
    # sync with `.github/actions/postgres`'s `image-repository` / `image-tag`
    # defaults — that action's inputs say so too.
    image: pgvector/pgvector:pg16
    container_name: prodect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prodect
      POSTGRES_PASSWORD: prodect
      POSTGRES_DB: prodect
    ports:
      # Host 5433 (port 5432 is reserved for other local Postgres instances).
      # Container port stays 5432 so Postgres tooling inside the container is unaffected.
      - '5433:5432'
    volumes:
      - prodect-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prodect -d prodect']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s

volumes:
  prodect-pg-data:
