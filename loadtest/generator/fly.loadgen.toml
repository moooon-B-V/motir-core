# The load-test generator app (MOTIR-9116) — one machine in `iad`, reproducible from this file.
#
# Deployed by `loadtest/generator/deploy.sh`; README §3.12–3.15 is the procedure. The app has no
# [http_service]: nothing reaches the generator but `fly ssh`, and staging is reached from it over
# flycast.
app            = "motir-loadgen"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# k6's point file and the run directory live here: `loadtest/run/generator.ts` VOLUME_MOUNT and
# REMOTE_RUN_DIR (`/data/run`). The run command refuses a generator with nothing mounted.
[mounts]
  source      = "loadgen_data"
  destination = "/data"

[[vm]]
  size   = "performance-2x"
  memory = "4gb"
