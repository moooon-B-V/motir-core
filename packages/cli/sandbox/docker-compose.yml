# The Motir sandbox — compose form (base: 7.9.7a, agent profiles: 7.9.7b).
#
# One service per agent PROFILE, selected with a compose profile so that
# `docker compose --profile claude run --rm sandbox-claude` builds and runs
# exactly the variant you asked for and nothing else.
#
#   cd packages/cli/sandbox
#   docker compose --profile claude build
#   docker compose --profile claude run --rm sandbox-claude \
#     motir auto --agent "claude --dangerously-skip-permissions"
#
# MOTIR_WORKSPACE overrides which host directory is mounted as /workspace; the
# default is the parent of this motir-core checkout, i.e. the usual workspace
# root holding the `.motir.json` tree.
#
# EVERY service carries exactly the same two base mounts — a writable
# /workspace and the READ-ONLY Motir PAT — plus, for an agent profile, that
# agent's OWN credential path, also read-only. The per-agent paths and the
# verified auto-approve flags are documented in ./README.md's profile matrix;
# nothing here is asserted from memory.
#
# CodeGraph interaction (7.9.7d, resolved by 7.9.7f): the image wires the
# codegraph MCP server into each agent that codegraph has a target for, writing
# that agent's own config file. For `codex` (~/.codex/config.toml) and
# `opencode` (~/.config/opencode/opencode.jsonc) that file would sit INSIDE the
# read-only credential mount below, and the host's copy shadowed it — those two
# agents saw no codegraph tools at run time. The entrypoint now points them at a
# config home the IMAGE owns (~/.motir-sandbox/agent-config), which no mount can
# shadow, so the mounts below are unchanged and both agents keep their host
# credential AND their tools. `claude`, `cursor` and `antigravity` keep their
# server config outside the mounted path and never needed this. See README.md.
#
# Two profiles mount NO credential directory, deliberately:
#   * antigravity — the CLI stores its token in the OS keyring, and no portable
#     on-disk location is documented. Guessing one would mount a path that does
#     not exist on the host, so it authenticates INSIDE the container instead.
#   * aider — its credential is a model API key from the environment (plus an
#     optional ~/.aider.conf.yml, mounted below), not a credential directory.

services:
  sandbox:
    profiles: ['base']
    image: motir-sandbox:base
    build:
      # The build context is the motir-core repo root — the image builds the
      # `motir` binary from this checkout (see the Dockerfile's builder stage).
      context: ../../..
      dockerfile: packages/cli/sandbox/Dockerfile
      args:
        AGENT: base
    working_dir: /workspace
    # Reap zombie processes: an unattended run spawns a coding agent that spawns
    # git/gh, and PID 1 here is a shell, not an init.
    init: true
    stdin_open: true
    tty: true
    volumes:
      # The ONLY writable host surface.
      - ${MOTIR_WORKSPACE:-../../../..}:/workspace
      # The PAT, READ-ONLY: the container consumes the credential and never
      # mints or rotates one (`motir auth login` is a HOST command).
      - ${HOME}/.config/motir:/home/node/.config/motir:ro
    # Deliberately absent, and asserted absent by the sandbox test:
    #   * no /var/run/docker.sock — the container must not be able to escape by
    #     driving the host daemon;
    #   * no other host bind mounts — the filesystem blast radius is the two
    #     mounts above.
    # NOT absent: network access. It is open by default and stays open — every
    # coding agent needs its provider API, and every dispatched item needs git
    # remotes plus the Motir server. This image confines the FILESYSTEM, not
    # egress; use docker's own network controls if you need more.

  # ── Tier 1 — first-class, tested profiles ──────────────────────────────────

  sandbox-claude:
    profiles: ['claude']
    image: motir-sandbox:claude
    build:
      context: ../../..
      dockerfile: packages/cli/sandbox/Dockerfile
      args:
        AGENT: claude
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ${MOTIR_WORKSPACE:-../../../..}:/workspace
      - ${HOME}/.config/motir:/home/node/.config/motir:ro
      - ${HOME}/.claude:/home/node/.claude:ro

  sandbox-codex:
    profiles: ['codex']
    image: motir-sandbox:codex
    build:
      context: ../../..
      dockerfile: packages/cli/sandbox/Dockerfile
      args:
        AGENT: codex
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ${MOTIR_WORKSPACE:-../../../..}:/workspace
      - ${HOME}/.config/motir:/home/node/.config/motir:ro
      - ${HOME}/.codex:/home/node/.codex:ro

  sandbox-opencode:
    profiles: ['opencode']
    image: motir-sandbox:opencode
    build:
      context: ../../..
      dockerfile: packages/cli/sandbox/Dockerfile
      args:
        AGENT: opencode
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    volumes:
      - ${MOTIR_WORKSPACE:-../../../..}:/workspace
      - ${HOME}/.config/motir:/home/node/.config/motir:ro
      # OpenCode splits the two: config in the XDG config dir, but the actual
      # credential in auth.json under the XDG DATA dir. Both are mounted —
      # mounting only the config dir would leave the agent unauthenticated.
      - ${HOME}/.config/opencode:/home/node/.config/opencode:ro
      - ${HOME}/.local/share/opencode:/home/node/.local/share/opencode:ro

  sandbox-kimi:
    profiles: ['kimi']
    image: motir-sandbox:kimi
    build:
      context: ../../..
      dockerfile: packages/cli/sandbox/Dockerfile
      args:
        AGENT: kimi
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    volumes:
      - ${MOTIR_WORKSPACE:-../../../..}:/workspace
      - ${HOME}/.config/motir:/home/node/.config/motir:ro
      - ${HOME}/.kimi-code:/home/node/.kimi-code:ro

  # ── Tier 2 — also-supported profiles ───────────────────────────────────────

  sandbox-antigravity:
    profiles: ['antigravity']
    image: motir-sandbox:antigravity
    build:
      context: ../../..
      dockerfile: packages/cli/sandbox/Dockerfile
      args:
        AGENT: antigravity
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    volumes:
      - ${MOTIR_WORKSPACE:-../../../..}:/workspace
      - ${HOME}/.config/motir:/home/node/.config/motir:ro
      # No agent credential mount: `agy` keeps its token in the OS keyring, with
      # no documented portable file. Sign in inside the container — the CLI
      # detects a non-local shell and prints a copy-paste authorization URL.

  sandbox-cursor:
    profiles: ['cursor']
    image: motir-sandbox:cursor
    build:
      context: ../../..
      dockerfile: packages/cli/sandbox/Dockerfile
      args:
        AGENT: cursor
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    environment:
      # The documented headless path — set it on the host and it passes through.
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
    volumes:
      - ${MOTIR_WORKSPACE:-../../../..}:/workspace
      - ${HOME}/.config/motir:/home/node/.config/motir:ro
      - ${HOME}/.local/share/cursor-agent:/home/node/.local/share/cursor-agent:ro

  sandbox-aider:
    profiles: ['aider']
    image: motir-sandbox:aider
    build:
      context: ../../..
      dockerfile: packages/cli/sandbox/Dockerfile
      args:
        AGENT: aider
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    environment:
      # Aider's credential IS the model key it reads from the environment.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ${MOTIR_WORKSPACE:-../../../..}:/workspace
      - ${HOME}/.config/motir:/home/node/.config/motir:ro
      # Not a credential DIRECTORY but a single config FILE. Create it on the
      # host (even empty) before using this profile — docker would otherwise
      # materialise the missing source as a root-owned directory.
      - ${HOME}/.aider.conf.yml:/home/node/.aider.conf.yml:ro

  sandbox-goose:
    profiles: ['goose']
    image: motir-sandbox:goose
    build:
      context: ../../..
      dockerfile: packages/cli/sandbox/Dockerfile
      args:
        AGENT: goose
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    environment:
      # Goose stores provider secrets in the OS keyring by default, which a
      # container has no access to; this makes it fall back to the file-based
      # secrets.yaml inside the mounted config dir.
      GOOSE_DISABLE_KEYRING: '1'
      # Non-interactive execution — approvals are handled automatically.
      GOOSE_MODE: auto
    volumes:
      - ${MOTIR_WORKSPACE:-../../../..}:/workspace
      - ${HOME}/.config/motir:/home/node/.config/motir:ro
      - ${HOME}/.config/goose:/home/node/.config/goose:ro
